  else if(m.type==='rename'){inner=`<h2>RENAME</h2><div class="field"><label>New Name</label><input type="text" id="m-name" placeholder="New name" autofocus autocomplete="off" value="${esc(m.value||'')}"></div>${m.err?`<div class="err-box">${esc(m.err)}</div>`:''}<div class="modal-btns"><button class="btn-g sm" id="m-cancel">CANCEL</button><button class="btn-p sm" id="m-ok">RENAME</button></div>`;}
  else if(m.type==='confirmDelete'){const items=m.indices.map(i=>S.files[i]).filter(Boolean);const names=items.map(f=>f.name);const prev=names.slice(0,8).map(n=>`<div style="color:var(--text-dim)">▸ ${esc(n)}</div>`).join('')+(names.length>8?`<div style="color:var(--text-dim)">…and ${names.length-8} more</div>`:'');inner=`<h2>CONFIRM DELETION</h2><p class="modal-sub">Permanently delete ${names.length} item${names.length!==1?'s':''}? This cannot be undone.</p><div class="modal-scroll">${prev}</div>${m.err?`<div class="err-box">${esc(m.err)}</div>`:''}<div class="modal-btns"><button class="btn-g sm" id="m-cancel">CANCEL</button><button class="btn-p sm" id="m-ok" style="border-color:var(--red);color:var(--red)">CONFIRM DELETE</button></div>`;}
  else if(m.type==='confirmOverwrite'){const prev=m.existing.slice(0,8).map(n=>`<div style="color:var(--text-dim)">▸ ${esc(n)}</div>`).join('')+(m.existing.length>8?`<div style="color:var(--text-dim)">…and ${m.existing.length-8} more</div>`:'');inner=`<h2>FILES ALREADY EXIST</h2><p class="modal-sub">${m.existing.length} file${m.existing.length!==1?'s':''} already exist in the vault.</p><div class="modal-scroll">${prev}</div>${m.err?`<div class="err-box">${esc(m.err)}</div>`:''}<div class="modal-btns"><button class="btn-g sm" id="m-cancel">CANCEL</button><button class="btn-g sm" id="m-skip">SKIP EXISTING</button><button class="btn-p sm" id="m-ok">OVERWRITE ALL</button></div>`;}
    else if(m.type==='scan'){const res=m.results;inner=`<h2>INTEGRITY SCAN</h2><p class="modal-sub">Verifies SHA-256 integrity footer of every DCR3 (v3) encrypted file.</p>${res?`<div class="modal-scroll"><div style="color:var(--green);margin-bottom:6px">✓ PASSED: ${res.passed}</div>${res.failed.length>0?`<div style="color:var(--red);margin-bottom:6px">✕ FAILED: ${res.failed.length}</div>${res.failed.map(f=>`<div style="color:var(--red);font-size:10px">▸ ${esc(f)}</div>`).join('')}`:''} ${res.skipped>0?`<div style="color:var(--text-dim);margin-top:6px">⊘ SKIPPED: ${res.skipped}</div>`:''}</div>`:`<div style="color:var(--text-dim);font-family:var(--ff-mono);font-size:11px;margin-bottom:16px">Click RUN SCAN to verify all files.</div>`}${m.err?`<div class="err-box">${esc(m.err)}</div>`:''}<div class="modal-btns"><button class="btn-g sm" id="m-cancel">CLOSE</button><button class="btn-p sm" id="m-ok" ${m.scanning?'disabled':''}>${m.scanning?'<span class="spin"></span>SCANNING…':'[ RUN SCAN ]'}</button></div>`;}

  else if(m.type==='changePassphrase'){const pp1v=m.pp1val||'',str=ppStrength(pp1v);inner=`<h2>CHANGE PASSPHRASE</h2><p class="modal-sub">✓ Instant — only the config is re-encrypted. Your files are not touched.</p><div class="field"><label>Current Passphrase</label><input type="password" id="m-pp" placeholder="Current passphrase" autofocus autocomplete="new-password"></div><div class="field"><label>New Passphrase <span class="hint">(min 12 chars)</span></label><input type="password" id="m-pp1" placeholder="New passphrase" autocomplete="new-password" value="${esc(pp1v)}"><div class="strength-bar-wrap" id="m-pp1-wrap"><div class="strength-bar" style="width:${str.pct}%;background:${str.color}"></div></div><div class="strength-lbl" id="m-pp1-lbl" style="color:${str.color}">${str.label}</div></div><div class="field"><label>Confirm New Passphrase</label><input type="password" id="m-pp2" placeholder="Repeat new passphrase" autocomplete="new-password" style="transition:border-color .25s,box-shadow .25s"><div id="m-pp2-match" style="font-size:11px;margin-top:5px;min-height:16px"></div></div><div class="field"><label>Hint <span class="hint">(optional \u2014 stored as plaintext)</span></label><input type="text" id="m-hint-cp" value="${esc(S.hint||'')}" placeholder="e.g. My favourite city + year" autocomplete="off"></div>${m.err?`<div class="err-box">${esc(m.err)}</div>`:''}<div class="modal-btns"><button class="btn-g sm" id="m-cancel">CANCEL</button><button class="btn-p sm" id="m-ok">CHANGE PASSPHRASE</button></div>`;}
  else if(m.type==='changeHint'){inner=`<h2>CHANGE LOGIN HINT</h2><p class="modal-sub">Shown only when user types "hint" on login screen. Stored as plaintext — do <strong>not</strong> include the passphrase itself.</p><div class="field"><label>Hint <span class="hint">(leave empty to remove)</span></label><input type="text" id="m-hint" value="${esc(S.hint||'')}" placeholder="e.g. My favourite city + year" autocomplete="off" autofocus></div>${m.err?`<div class="err-box">${esc(m.err)}</div>`:''}<div class="modal-btns"><button class="btn-g sm" id="m-cancel">CANCEL</button><button class="btn-p sm" id="m-ok">SAVE HINT</button></div>`;}
  else if(m.type==='idleTimeout'){const cur=m.selectedMinutes||S.idleMinutes;const opts=[5,10,15,30,60];inner=`<h2>AUTO-LOCK TIMEOUT</h2><p class="modal-sub">Lock the vault after this period of inactivity.</p><div class="field"><label>Timeout</label><div class="idle-opts">${opts.map(v=>`<button class="idle-btn${cur===v?' active':''}" data-idle-val="${v}">${v} min</button>`).join('')}</div></div><div class="modal-btns"><button class="btn-g sm" id="m-cancel">CANCEL</button><button class="btn-p sm" id="m-ok">APPLY</button></div>`;}
  else if(m.type==='algoSelect'){const cur=m.selectedAlgo!==undefined?m.selectedAlgo:S.vaultAlgo;inner=`<h2>ENCRYPTION ALGORITHM</h2><p class="modal-sub">Sets the cipher for new file uploads. Each file stores its own COSE algorithm ID (RFC 9052) in the header — existing files are not affected.</p><div class="field"><label>Algorithm for new uploads</label><div class="idle-opts">${Object.entries(ALGO_META).map(([id,meta])=>`<button class="idle-btn${cur==id?' active':''}" data-algo-val="${id}">${meta.label}${meta.pqcSafe?'<span style="margin-left:6px;font-size:9px;color:var(--green)">✓ PQC</span>':'<span style="margin-left:6px;font-size:9px;color:var(--yellow)">⚠ PQC</span>'}</button>`).join('')}</div><div style="margin-top:12px;font-size:10.5px;color:var(--text-dim);line-height:1.6">COSE IDs (RFC 9052): AES-128-GCM=<strong>1</strong>, AES-192-GCM=<strong>2</strong>, AES-256-GCM=<strong>3</strong>.<br>PQC note: symmetric ciphers are safe — only key encapsulation needs PQC upgrade (future ML-KEM).</div></div><div class="modal-btns"><button class="btn-g sm" id="m-cancel">CANCEL</button><button class="btn-p sm" id="m-ok">APPLY</button></div>`;}

  else if(m.type==='vaultEncryptAll'){inner=`<h2>ENCRYPT ENTIRE VAULT</h2><p class="modal-sub">Every plain file in the vault will be encrypted in-place recursively. Already-encrypted files are safely skipped. This cannot be undone without decrypting again.</p><div style="background:rgba(108,203,95,.06);border:1px solid rgba(108,203,95,.2);border-radius:6px;padding:12px 14px;font-size:12px;color:rgba(108,203,95,.8);margin-bottom:10px;line-height:1.7">• Vault config &amp; system files are untouched<br>• Run <strong>Decrypt All</strong> before copying files out</div>${m.progress!=null?`<div style="font-size:12px;color:var(--text-dim);margin-bottom:8px">${esc(m.progress)}</div>`:''}${m.err?`<div class="err-box">${esc(m.err)}</div>`:''}<div class="modal-btns"><button class="btn-g sm" id="m-cancel" ${m.running?'disabled':''}>CANCEL</button><button class="btn-p sm" id="m-ok" style="border-color:var(--green);color:var(--green)" ${m.running?'disabled':''}>${m.running?'<span class="spin"></span>ENCRYPTING…':'🔒 ENCRYPT ALL'}</button></div>`;}
  else if(m.type==='vaultDecryptAll'){inner=`<h2>DECRYPT ENTIRE VAULT</h2><p class="modal-sub">Every encrypted file in the vault will be decrypted in-place recursively. Plain files are safely skipped. Files will be readable without the passphrase after this.</p><div style="background:rgba(231,72,86,.06);border:1px solid rgba(231,72,86,.2);border-radius:6px;padding:12px 14px;font-size:12px;color:rgba(231,72,86,.8);margin-bottom:10px;line-height:1.7">⚠ All files will be stored in plain text<br>• Use this only before copying the vault to another location</div>${m.progress!=null?`<div style="font-size:12px;color:var(--text-dim);margin-bottom:8px">${esc(m.progress)}</div>`:''}${m.err?`<div class="err-box">${esc(m.err)}</div>`:''}<div class="modal-btns"><button class="btn-g sm" id="m-cancel" ${m.running?'disabled':''}>CANCEL</button><button class="btn-p sm" id="m-ok" style="border-color:var(--red);color:var(--red)" ${m.running?'disabled':''}>${m.running?'<span class="spin"></span>DECRYPTING…':'🔓 DECRYPT ALL'}</button></div>`;}

  return`<div class="modal-bg" id="modal-bg"><div class="modal-box">${inner}</div></div>`;
}

function bindModalEvents(){
  const _cancelModal=()=>{const fo=S.modal?.fromOptions;S.modal=null;if(fo)S.optionsOpen=true;render();};
  document.getElementById('m-cancel')?.addEventListener('click',_cancelModal);
  document.getElementById('modal-bg')?.addEventListener('click',e=>{if(e.target.id==='modal-bg')_cancelModal();});
  document.getElementById('m-name')?.focus();
  const noteEl=document.getElementById('m-note');if(noteEl){noteEl.focus();noteEl.setSelectionRange(noteEl.value.length,noteEl.value.length);}
  attachStrengthMeter('m-pp1','m-pp1-wrap','m-pp1-lbl');
  document.getElementById('m-pp1')?.addEventListener('input',e=>{S.modal.pp1val=e.target.value;_updateMatchIndicator();});
  (function _updateMatchIndicator(){
    const pp1El=document.getElementById('m-pp1'),pp2El=document.getElementById('m-pp2'),ind=document.getElementById('m-pp2-match');if(!pp2El||!ind)return;
    const v1=pp1El?.value||'',v2=pp2El.value;
    if(!v2){ind.textContent='';pp2El.style.borderColor='';pp2El.style.boxShadow='';return;}
    if(v1===v2){ind.textContent='✓ Passphrases match';ind.style.color='#6ccb5f';pp2El.style.borderColor='#6ccb5f';pp2El.style.boxShadow='0 0 0 2px rgba(108,203,95,.25)';}
    else{ind.textContent='✗ Does not match yet';ind.style.color='rgba(255,255,255,.35)';pp2El.style.borderColor='';pp2El.style.boxShadow='';}
  })();
  document.getElementById('m-pp2')?.addEventListener('input',function _updateMatchIndicator(){
    const pp1El=document.getElementById('m-pp1'),ind=document.getElementById('m-pp2-match');if(!ind)return;
    const v1=pp1El?.value||'',v2=this.value;
    if(!v2){ind.textContent='';this.style.borderColor='';this.style.boxShadow='';return;}
    if(v1===v2){ind.textContent='✓ Passphrases match';ind.style.color='#6ccb5f';this.style.borderColor='#6ccb5f';this.style.boxShadow='0 0 0 2px rgba(108,203,95,.25)';}
    else{ind.textContent='✗ Does not match yet';ind.style.color='rgba(255,255,255,.35)';this.style.borderColor='';this.style.boxShadow='';}
  });
  document.getElementById('m-skip')?.addEventListener('click',async()=>{const m=S.modal;S.modal=null;await encryptAndStore(m.files.filter(f=>!m.existing.includes(f.name)));});
  document.querySelectorAll('[data-idle-val]').forEach(btn=>btn.addEventListener('click',()=>{S.modal.selectedMinutes=parseInt(btn.dataset.idleVal);render();}));
  document.querySelectorAll('[data-algo-val]').forEach(btn=>btn.addEventListener('click',()=>{S.modal.selectedAlgo=parseInt(btn.dataset.algoVal);render();}));
  const mOk=document.getElementById('m-ok');if(!mOk)return;
  mOk.addEventListener('click',async()=>{
    const m=S.modal;resetIdleTimer();
    if(m.type==='mkdir'){
      const name=(document.getElementById('m-name')?.value||'').trim();
      if(!name){m.err='Please enter a folder name.';render();return;}
      if(/[/\\<>:"|?*]/.test(name)){m.err='Invalid folder name.';render();return;}
      try{const cpk=computePathKey(S.breadcrumb,S.currentDir);const nh=await S.currentDir.getDirectoryHandle(name,{create:true});const ck=cpk===''?name:cpk+'/'+name;S.treeHandles[ck]=nh;delete S.treeNodes[cpk];await treeLoad(cpk,S.currentDir);S.treeExpanded.add(cpk);S.files=await vaultList(S.currentDir);S.modal=null;render();toast('Directory created: '+name,'ok');}catch(e){m.err=e.message;render();}
    }else if(m.type==='rename'){
      const nn=(document.getElementById('m-name')?.value||'').trim();if(!nn){m.err='Please enter a name.';render();return;}if(/[\\<>:"|?*]/.test(nn)||nn.includes('/')){m.err='Invalid name.';render();return;}
      const entry=S.files[m.fileIdx];if(!entry)return;if(nn===entry.name){S.modal=null;render();return;}
      // check collision
      let collision=false;
      try{if(entry.kind==='dir')await S.currentDir.getDirectoryHandle(nn);else await S.currentDir.getFileHandle(nn);collision=true;}catch{}
      if(collision){m.err=`"${nn}" already exists.`;render();return;}
      try{
        if(entry.kind==='dir'){
          // copy all entries recursively then remove old dir
          async function copyDir(srcH,destParent,name){
            const dh=await destParent.getDirectoryHandle(name,{create:true});
            for await(const[n,h]of srcH.entries()){if(h.kind==='directory')await copyDir(h,dh,n);else{const buf=await(await h.getFile()).arrayBuffer();const wh=await dh.getFileHandle(n,{create:true});const w=await wh.createWritable();await w.write(buf);await w.close();}}
          }
          await copyDir(entry.handle,S.currentDir,nn);
          await S.currentDir.removeEntry(entry.name,{recursive:true});
          // refresh tree
          const pk=computePathKey(S.breadcrumb,S.currentDir);
          const dk=pk===''?entry.name:pk+'/'+entry.name;
          for(const k of Object.keys(S.treeNodes)){if(k===dk||k.startsWith(dk+'/')){delete S.treeNodes[k];delete S.treeHandles[k];S.treeExpanded?.delete(k);}}
          delete S.treeNodes[pk];await treeLoad(pk,S.currentDir);
        }else{
          const raw=await(await entry.handle.getFile()).arrayBuffer();
          const nfh=await S.currentDir.getFileHandle(nn,{create:true});const w=await nfh.createWritable();await w.write(raw);await w.close();
          await S.currentDir.removeEntry(entry.name);
        }
        S.selectedSet=new Set();S.files=await vaultList(S.currentDir);S.modal=null;render();toast('Renamed to: '+nn,'ok');
      }catch(e){m.err=e.message;render();}
    }else if(m.type==='confirmDelete'){S.modal=null;await doDelete(m.indices);}
    else if(m.type==='confirmOverwrite'){S.modal=null;await encryptAndStore(m.files);}
    else if(m.type==='scan'){
      m.scanning=true;render();const results={passed:0,failed:[],skipped:0};
      async function scanDir(dir,px)
      {
        for await(const[name,handle]of dir.entries())
        {
            if(SYS_FILES.has(name))continue;
            if(handle.kind==='directory')
            {
                await scanDir(handle,px?px+'/'+name:name);
                continue;
            }
            try
            {
                const f=await handle.getFile();
                const buf=new Uint8Array(await f.arrayBuffer());
                if(!hasMagicV3(buf))
                {
                    results.skipped++;
                    continue;
                }
                const aid=buf[4]|(buf[5]<<8);
                const am=ALGO_META[aid]||ALGO_META[COSE_AES256GCM];
                const minLen=6+am.ivLen+HASH_LEN+16;if(buf.length<minLen){results.failed.push((px?px+'/':'')+name+' (too short)');continue;}const body=buf.subarray(0,buf.length-HASH_LEN),stored=buf.subarray(buf.length-HASH_LEN),actual=new Uint8Array(await crypto.subtle.digest('SHA-256',body));let ok=true;for(let i=0;i<HASH_LEN;i++){if(stored[i]!==actual[i]){ok=false;break;}}if(ok)results.passed++;else results.failed.push((px?px+'/':'')+name);}catch(e){results.failed.push((px?px+'/':'')+name+' ('+e.message+')');}}}
      try{await scanDir(S.vaultDir,'');m.scanning=false;m.results=results;render();if(results.failed.length===0)toast(`✓ All ${results.passed} file(s) passed.`,'ok');else toast(`⚠ ${results.failed.length} file(s) FAILED integrity check!`,'err',8000);}catch(e){m.scanning=false;m.err=e.message;render();}
    }else if(m.type==='changePassphrase'){const pp=document.getElementById('m-pp')?.value||'',pp1=document.getElementById('m-pp1')?.value||'',pp2=document.getElementById('m-pp2')?.value||'';if(!pp||!pp1||!pp2){m.err='All fields are required.';render();return;}if(pp1!==pp2){m.err='Passphrases do not match.';render();return;}if(pp1.length<12){m.err='Passphrase must be at least 12 characters.';render();return;}const err=await actChangePassphrase(pp,pp1);if(err){m.err=err;render();return;}const newHint=(document.getElementById('m-hint-cp')?.value||'').trim();if(newHint!==( S.hint||'').trim())await actChangeHint(newHint);S.modal=null;render();toast('Passphrase changed.','ok');}
    else if(m.type==='changeHint'){const h=(document.getElementById('m-hint')?.value||'').trim();await actChangeHint(h);S.modal=null;render();}
    else if(m.type==='idleTimeout'){const v=m.selectedMinutes||S.idleMinutes;S.idleMinutes=v;savePrefs();resetIdleTimer();S.modal=null;render();toast(`Auto-lock set to ${v} minutes.`,'ok');}
    else if(m.type==='algoSelect'){const a=m.selectedAlgo!==undefined?m.selectedAlgo:S.vaultAlgo;S.vaultAlgo=a;savePrefs();S.modal=null;render();toast(`Algorithm: ${ALGO_META[a]?.label||'?'}`,'ok');}
    else if(m.type==='vaultEncryptAll'){m.running=true;render();try{const n=await encryptDirRecursive(S.vaultDir,S.sessionKey,S.vaultAlgo||COSE_AES256GCM);S.files=await vaultList(S.currentDir);S.modal=null;S.optionsOpen=false;render();toast(`Encrypted ${n} file${n!==1?'s':''} across vault.`,'ok',5000);}catch(e){m.running=false;m.err=e.message;render();}}
    else if(m.type==='vaultDecryptAll'){m.running=true;render();try{const n=await decryptDirRecursive(S.vaultDir,S.sessionKey);S.files=await vaultList(S.currentDir);S.modal=null;S.optionsOpen=false;render();toast(`Decrypted ${n} file${n!==1?'s':''} across vault.`,'ok',5000);}catch(e){m.running=false;m.err=e.message;render();}}
  });
}

/* ══════════════════════════════════════════════════════
   ACTIONS  —  All user-triggered async operations
══════════════════════════════════════════════════════ */

/**
 * Open a folder picker (Chrome/Edge) and navigate to the vault start.
 * Detected as new vault if no .dcconfig exists → setup screen.
 */
async function actOpen()
{
    try
    {
        const dir = await window.showDirectoryPicker({ mode: 'readwrite' });
        S.vaultDir = dir;
        S.isOPFS   = false;
        S.errMsg   = null;
        _lockoutClear();

        const hc  = await cfgExists(dir);
        S.view    = hc ? 'login' : 'setup';
        S.hint    = hc ? await hintLoad(dir) : null;
        _lockoutLoad();
        render();
    }
    catch (e)
    {
        /* AbortError = user cancelled the picker — not an error */
        if (e.name !== 'AbortError')
        {
            S.errMsg = e.message;
            render();
        }
    }
}

/** Navigate back to the start screen (change vault). */
function actOpenAny()
{
    S.errMsg = null;
    S.view   = 'start';
    render();
}

/**
 * Open (or create) a vault in OPFS storage (Firefox).
 * Vault name is sanitised to allow only safe filename characters.
 * @param {string} vaultName  Name chosen by the user.
 */
async function actOpenOPFS(vaultName)
{
    try
    {
        const name     = (vaultName || '').trim() || 'nimku-vault';
        const safeName = name.replace(/[^a-zA-Z0-9 _\-]/g, '').trim() || 'nimku-vault';
        const root     = await navigator.storage.getDirectory();

        /* Collect existing vault directory names for the picker list */
        const vaults = [];
        for await (const [k, h] of root.entries())
        {
            if (h.kind === 'directory') { vaults.push(k); }
        }
        S.opfsVaults = vaults.sort();

        /* Open (or create) the vault subdirectory inside OPFS root */
        const dir = await root.getDirectoryHandle(safeName, { create: true });
        S.vaultDir      = dir;
        S.isOPFS        = true;
        S.opfsVaultName = safeName;
        S.errMsg        = null;
        _lockoutClear();

        const hc = await cfgExists(dir);
        S.view   = hc ? 'login' : 'setup';
        S.hint   = hc ? await hintLoad(dir) : null;
        _lockoutLoad();
        render();
    }
    catch (e)
    {
        S.errMsg = e.message;
        render();
    }
}

/**
 * Handle the login form submission.
 * Derives the KEK from the passphrase, decrypts the config, loads prefs.
 * On success → S.view = 'explorer'.
 */
async function actLogin(e)
{
    e.preventDefault();
    if (S.loading || S.lockoutUntil > Date.now()) { return; }

    const pp = (document.getElementById('l-pp')._real || '');
    if (!pp)
    {
        S.errMsg = 'Please enter your passphrase.';
        render();
        return;
    }

    /* Special case: typing "hint" reveals the login hint box */
    if (pp.toLowerCase() === 'hint')
    {
        const hel = document.getElementById('hint-reveal');
        if (hel && S.hint) { hel.style.display = 'block'; }
        return;
    }

    S.loading = true;
    S.errMsg  = null;
    render();

    try
    {
        const res = await cfgLoad(S.vaultDir, pp);

        /* Wrong passphrase or corrupt config */
        if (!res)
        {
            S.failedAttempts++;
            if (S.failedAttempts >= MAX_ATTEMPTS)
            {
                /* Too many failures — lock out for LOCKOUT_SECS seconds */
                S.lockoutUntil   = Date.now() + LOCKOUT_SECS * 1000;
                S.failedAttempts = 0;
            }
            _lockoutSave();
            S.loading = false;
            S.errMsg  = 'Authentication failed.';
            render();
            return;
        }

        /* Auth succeeded — populate session state */
        _lockoutClear();
        S.lockoutUntil   = 0;
        S.sessionKey     = res.key;
        S.sessionStart   = Date.now();
        S.currentDir     = S.vaultDir;
        S.breadcrumb     = [];
        S.navBack        = [];
        S.navForward     = [];
        S.view           = 'explorer';
        S.searchQuery    = '';

        /* Load user preferences (favourites, hidden files, etc.) */
        const prefs      = await prefsLoad(S.vaultDir, res.key);
        S.favourites     = prefs.favourites  || [];
        S.recentFiles    = prefs.recentFiles || [];
        S.idleMinutes    = prefs.idleMinutes || 15;
        S.hiddenFiles    = new Set(prefs.hiddenFiles || []);
        S.dirIcons       = prefs.dirIcons    || {};

        /* Record the previous login timestamp (shown on login screen) */
        S.lastLogin = res.cfg?.lastLogin || null;

        /* Preferred encryption algorithm: prefs override config default */
        S.vaultAlgo = (prefs.vaultAlgo !== undefined && ALGO_META[prefs.vaultAlgo])
            ? prefs.vaultAlgo
            : (res.cfg?.algo || COSE_AES256GCM);
        S.vaultHasMasterKey = !!(res.cfg?.masterKey);

        if (res.cfg?.masterKey)
        {
            /*
             * DEK/KEK split vault: rotate the KEK (update salt + re-encrypt config)
             * while keeping the DEK unchanged. Files are not touched.
             */
            const newKey = await cfgSave(S.vaultDir, pp, { ...res.cfg, lastLogin: Date.now() });
            S.sessionKey = newKey;
        }
        else
        {
            /*
             * Legacy vault: KEK = file key. Do NOT rotate the salt or all files
             * become permanently unreadable. Only update lastLogin in-place.
             */
            await cfgSaveInPlace(S.vaultDir, res.kek, res.salt,
                { ...(res.cfg || {}), lastLogin: Date.now() });
            /* S.sessionKey is already set to res.key (= kek) above */
        }

        await treeInit();
        S.files     = await vaultList(S.vaultDir);
        S.vaultSize = await computeVaultSize(S.vaultDir);
        S.loading   = false;
        statsLoad();
        render();
        startIdleTimer();
        startHUD();
    }
    catch (err)
    {
        S.loading = false;
        S.errMsg  = 'Auth error: ' + err.message;
        render();
    }
}

/**
 * Handle the vault setup form (first-time initialisation).
 * Generates a random 256-bit DEK, encrypts it with the user’s passphrase,
 * and writes the config. Then immediately opens the explorer.
 */
async function actSetup(e)
{
    e.preventDefault();
    if (S.loading) { return; }

    const pp   = document.getElementById('s-pp').value;
    const pp2  = document.getElementById('s-pp2').value;
    const hint = (document.getElementById('s-hint')?.value || '').trim();

    /* Validate inputs */
    if (!pp)              { S.errMsg = 'Please enter a passphrase.';               render(); return; }
    if (pp !== pp2)       { S.errMsg = 'Passphrases do not match.';                render(); return; }
    if (pp.length < 12)   { S.errMsg = 'Passphrase must be at least 12 characters.'; render(); return; }

    S.loading = true;
    S.errMsg  = null;
    render();

    try
    {
        /* Generate a cryptographically random 256-bit DEK (Data Encryption Key) */
        const mkBytes = rnd(32);
        const mkHex   = [...mkBytes].map(b => b.toString(16).padStart(2, '0')).join('');

        /* Create the vault config, encrypting the DEK with the user's passphrase */
        const key = await cfgSave(S.vaultDir, pp, { v: 2, masterKey: mkHex, algo: COSE_AES256GCM });

        /* Optionally save the plaintext login hint */
        if (hint) { await hintSave(S.vaultDir, hint); }

        /* Populate session state and open the explorer */
        S.sessionKey        = key;
        S.vaultAlgo         = COSE_AES256GCM;
        S.vaultHasMasterKey = true;
        S.sessionStart      = Date.now();
        S.favourites        = [];
        S.recentFiles       = [];
        S.currentDir        = S.vaultDir;
        S.breadcrumb        = [];
        S.navBack           = [];
        S.navForward        = [];
        S.view              = 'explorer';
        S.searchQuery       = '';

        await treeInit();
        S.files   = await vaultList(S.vaultDir);
        S.loading = false;
        statsLoad();
        render();
        startIdleTimer();
        startHUD();
    }
    catch (err)
    {
        S.loading = false;
        S.errMsg  = 'Setup error: ' + err.message;
        render();
    }
}

/**
 * Lock the vault: wipe all session state from memory.
 * The vault directory handle is kept so the user can re-authenticate.
 * Stats are intentionally NOT reset (they persist in localStorage).
 */
function actLock()
{
    stopIdleTimer();
    stopHUD();

    /* Stop legacy clock interval if still running */
    if (_clockIv)
    {
        clearInterval(_clockIv);
        _clockIv = null;
    }

    /* Wipe all sensitive session data */
    S.sessionKey        = null;
    S.sessionStart      = null;
    S.currentDir        = null;
    S.breadcrumb        = [];
    S.navBack           = [];
    S.navForward        = [];
    S.files             = [];
    S.errMsg            = null;
    S.treeNodes         = {};
    S.treeHandles       = {};
    S.treeExpanded      = null;
    S.selectedSet       = new Set();
    S.userMenuOpen      = false;
    S.optionsOpen       = false;
    S.optsSub           = null;
    S.vaultHasMasterKey = false;
    S.hiddenFiles       = new Set();
    S.dirIcons          = {};
    S.clipboard         = null;
    S.sortMenuOpen      = false;
    S.viewMenuOpen      = false;
    /* stats persist in localStorage — do NOT reset here */

    S.view = 'login';
    document.onkeydown = null; /* Remove explorer keyboard shortcuts */
    render();
}

/**
 * Log out completely: lock the vault then discard the vault directory handle.
 * Returns to the start screen so the user can pick a different vault.
 */
function actLogout()
{
    actLock();
    S.vaultDir       = null;
    S.hint           = null;
    S.failedAttempts = 0;
    S.lockoutUntil   = 0;
    S.view           = 'start';
    render();
}

/** Refresh the current directory listing and recompute vault size. */
async function actRefresh()
{
    S.selectedSet = new Set();
    S.files       = await vaultList(S.currentDir);
    S.vaultSize   = await computeVaultSize(S.vaultDir);
    render();
}

/**
 * Sort the file list by the given field.
 * Toggling the same field reverses direction; a new field always starts ascending.
 * Directories are always kept at the top regardless of sort order.
 */
function actSort(field)
{
    if (S.sortBy === field)
    {
        /* Toggle direction when clicking the same column header */
        S.sortDir = (S.sortDir === 'asc') ? 'desc' : 'asc';
    }
    else
    {
        S.sortBy  = field;
        S.sortDir = 'asc'; /* New column always starts ascending */
    }

    /* Separate dirs (always first) and files (sorted by chosen field) */
    const dirs = S.files.filter(f => f.kind === 'dir');
    const fls  = S.files.filter(f => f.kind === 'file');

    const cmp = (a, b) =>
    {
        if (S.sortBy === 'size') { return (a.plainSize || 0) - (b.plainSize || 0); }
        if (S.sortBy === 'date') { return (a.modified  || 0) - (b.modified  || 0); }
        return a.name.localeCompare(b.name);
    };

    const d = (S.sortDir === 'desc') ? -1 : 1;
    fls.sort((a, b) => d * cmp(a, b));
    dirs.sort((a, b) => a.name.localeCompare(b.name));
    S.files = [...dirs, ...fls];
    render();
}

/** Close all open dropdown menus (sort/view). Called on document click. */
function _closeMenus()
{
    if (S.sortMenuOpen || S.viewMenuOpen) {
        S.sortMenuOpen = false;
        S.viewMenuOpen = false;
        render();
    }
}

/**
 * Mark selected items for cutting (move on paste).
 * The clipboard holds the entry list and the source directory handle.
 */
function actCut()
{
    const entries = [...S.selectedSet].map(i => S.files[i]).filter(Boolean);
    if (!entries.length) { return; }
    S.clipboard = { mode: 'cut', entries, srcDir: S.currentDir };
    toast(`Cut ${entries.length} item${entries.length !== 1 ? 's' : ''}.`, 'inf');
    render();
}

/**
 * Mark selected items for copying.
 * Unlike cut, the source files are not deleted after paste.
 */
function actCopy()
{
    const entries = [...S.selectedSet].map(i => S.files[i]).filter(Boolean);
    if (!entries.length) { return; }
    S.clipboard = { mode: 'copy', entries, srcDir: S.currentDir };
    toast(`Copied ${entries.length} item${entries.length !== 1 ? 's' : ''}.`, 'inf');
    render();
}

/**
 * Paste clipboard contents into the current directory.
 * For 'cut' mode, source files are deleted after copying.
 * Directories are NOT yet supported by paste (files only).
 */
async function actPaste()
{
    if (!S.clipboard?.entries?.length) { return; }

    const { mode, entries, srcDir } = S.clipboard;
    S.loading = true;
    S.loadMsg = 'PASTING…';
    render();

    let done = 0;
    for (const entry of entries)
    {
        try
        {
            /* Resolve a non-colliding destination name.
               For copy: append _1, _2… before the extension.
               For cut into same dir: allow same name (it overwrites itself). */
            let destName = entry.name;
            const isSameDir = (mode === 'cut') && (await S.currentDir.isSameEntry(srcDir).catch(() => false));
            if (!isSameDir)
            {
                /* Split name into base + extension */
                const dot  = entry.name.lastIndexOf('.');
                const base = dot > 0 ? entry.name.slice(0, dot) : entry.name;
                const ext  = dot > 0 ? entry.name.slice(dot)    : '';
                let counter = 1;
                while (true)
                {
                    try
                    {
                        await S.currentDir.getFileHandle(destName);
                        /* File exists — try next counter */
                        destName = `${base}_${counter}${ext}`;
                        counter++;
                    }
                    catch { break; } /* Name is free */
                }
            }

            /* Copy the raw file bytes to the destination directory */
            const raw  = await (await entry.handle.getFile()).arrayBuffer();
            const dest = await S.currentDir.getFileHandle(destName, { create: true });
            const w    = await dest.createWritable();
            await w.write(raw);
            await w.close();

            /* For 'cut', remove the source file */
            if (mode === 'cut') { await srcDir.removeEntry(entry.name); }
            done++;
        }
        catch (e)
        {
            toast('Paste failed: ' + entry.name + ' — ' + e.message, 'err', 5000);
        }
    }

    /* Clear clipboard after a cut-paste (keep after copy-paste for repeated pasting) */
    if (mode === 'cut') { S.clipboard = null; }

    S.selectedSet = new Set();
    S.files       = await vaultList(S.currentDir);
    S.loading     = false;
    render();
    toast(`Pasted ${done} item${done !== 1 ? 's' : ''}.`, 'ok');
}

/**
 * Encrypt a single file in place (low-level, no UI state change).
 * The plaintext file is overwritten with its DCR3-encrypted form.
 * Skips files that are already encrypted.
 * @param {number} i  Index into S.files.
 */
async function actEncryptFile(i)
{
    const entry = S.files[i];
    if (!entry || entry.kind !== 'file' || entry.encrypted) { return; }

    const raw = await (await entry.handle.getFile()).arrayBuffer();
    const out = await v3EncryptBuf(S.vaultAlgo || COSE_AES256GCM, S.sessionKey, raw);
    const fh  = await S.currentDir.getFileHandle(entry.name, { create: true });
    const w   = await fh.createWritable();
    await w.write(out);
    await w.close();
}

/**
 * Recursively encrypt all plain files inside a directory handle.
 * Already-encrypted files are detected by their DCR3 magic header and skipped.
 * @param {FileSystemDirectoryHandle} dirH  Directory to process.
 * @param {CryptoKey}                 key   Session encryption key.
 * @param {number}                    algo  COSE algorithm ID.
 * @returns {Promise<number>} Count of files successfully encrypted.
 */
async function encryptDirRecursive(dirH, key, algo)
{
    let count = 0;
    for await (const [name, handle] of dirH.entries())
    {
        if (SYS_FILES.has(name)) { continue; } /* Skip system/metadata files */

        if (handle.kind === 'directory')
        {
            /* Recurse into sub-directories */
            count += await encryptDirRecursive(handle, key, algo);
        }
        else
        {
            try
            {
                const f    = await handle.getFile();
                const head = new Uint8Array(await f.slice(0, 8).arrayBuffer());

                if (hasMagicV3(head)) { continue; } /* Skip already-encrypted files */

                /* Encrypt and overwrite in place */
                const raw = await f.arrayBuffer();
                const out = await v3EncryptBuf(algo, key, raw);
                const fh  = await dirH.getFileHandle(name, { create: true });
                const w   = await fh.createWritable();
                await w.write(out);
                await w.close();
                count++;
                statsRecord('enc', true);
            }
            catch (e)
            {
                statsRecord('enc', false);
                console.error('encryptDirRecursive: failed on file', name, e);
            }
        }
    }
    return count;
}

/**
 * Recursively decrypt all DCR3-encrypted files inside a directory handle.
 * Plain files are detected by absence of the DCR3 magic header and skipped.
 * @param {FileSystemDirectoryHandle} dirH  Directory to process.
 * @param {CryptoKey}                 key   Session decryption key.
 * @returns {Promise<number>} Count of files successfully decrypted.
 */
async function decryptDirRecursive(dirH, key)
{
    let count = 0;
    for await (const [name, handle] of dirH.entries())
    {
        if (SYS_FILES.has(name)) { continue; } /* Skip system/metadata files */

        if (handle.kind === 'directory')
        {
            /* Recurse into sub-directories */
            count += await decryptDirRecursive(handle, key);
        }
        else
        {
            try
            {
                const f    = await handle.getFile();
                const head = new Uint8Array(await f.slice(0, 8).arrayBuffer());

                if (!hasMagicV3(head)) { continue; } /* Skip plain (non-encrypted) files */

                /* Reconstruct a fake entry descriptor so we can call vaultRead() */
                const aid        = head[4] | (head[5] << 8);
                const am         = ALGO_META[aid] || ALGO_META[COSE_AES256GCM];
                const over       = 6 + am.ivLen + 16 + HASH_LEN;
                const plainSize  = Math.max(0, f.size - over);
                const fakeEntry  = { name, handle, kind: 'file', encrypted: true, encSize: f.size, plainSize, modified: f.lastModified };

                /* Decrypt and overwrite in place */
                const plain = await vaultRead(fakeEntry, key);
                const fh    = await dirH.getFileHandle(name, { create: true });
                const w     = await fh.createWritable();
                await w.write(plain);
                await w.close();
                count++;
                statsRecord('dec', true);
            }
            catch (e)
            {
                statsRecord('dec', false);
                console.error('decryptDirRecursive: failed on file', name, e);
            }
        }
    }
    return count;
}

/**
 * Encrypt all selected plain files and/or all files inside selected directories.
 * Directories are processed recursively. Already-encrypted files are skipped.
 */
async function actEncryptSelected()
{
    const fileIndices = [...S.selectedSet].filter(i => S.files[i]?.kind === 'file' && !S.files[i].encrypted);
    const dirIndices  = [...S.selectedSet].filter(i => S.files[i]?.kind === 'dir');
    if (!fileIndices.length && !dirIndices.length) { return; }

    S.loading = true;
    S.loadMsg = 'ENCRYPTING…';
    render();

    let ok = 0;

    /* Encrypt individually selected plain files */
    for (const i of fileIndices)
    {
        try
        {
            await actEncryptFile(i);
            ok++;
            statsRecord('enc', true);
        }
        catch (e)
        {
            statsRecord('enc', false);
            toast('Encrypt failed: ' + S.files[i]?.name + ' — ' + e.message, 'err', 5000);
        }
    }

    /* Recursively encrypt all plain files inside selected directories */
    for (const i of dirIndices)
    {
        const entry   = S.files[i];
        S.loadMsg     = `ENCRYPTING DIR: ${entry.name}…`;
        render();
        try
        {
            const n = await encryptDirRecursive(entry.handle, S.sessionKey, S.vaultAlgo || COSE_AES256GCM);
            ok += n;
        }
        catch (e)
        {
            toast('Encrypt dir failed: ' + entry.name + ' — ' + e.message, 'err', 5000);
        }
    }

    S.selectedSet = new Set();
    S.files       = await vaultList(S.currentDir);
    S.loading     = false;
    render();
    if (ok > 0) { toast(`Encrypted ${ok} file${ok !== 1 ? 's' : ''}.`, 'ok'); }
}

/**
 * Decrypt all selected encrypted files and/or all files inside selected directories.
 * Files are decrypted in-place (encrypted content is replaced with plaintext).
 */
async function actDecryptSelected()
{
    const fileIndices = [...S.selectedSet].filter(i => S.files[i]?.kind === 'file' && S.files[i].encrypted);
    const dirIndices  = [...S.selectedSet].filter(i => S.files[i]?.kind === 'dir');
    if (!fileIndices.length && !dirIndices.length) { return; }

    S.loading = true;
    S.loadMsg = 'DECRYPTING…';
    render();

    let ok = 0;

    /* Decrypt individually selected encrypted files */
    for (const i of fileIndices)
    {
        const entry = S.files[i];
        try
        {
            const plain = await vaultRead(entry, S.sessionKey);
            const fh    = await S.currentDir.getFileHandle(entry.name, { create: true });
            const w     = await fh.createWritable();
            await w.write(plain);
            await w.close();
            ok++;
            statsRecord('dec', true);
        }
        catch (e)
        {
            statsRecord('dec', false);
            toast('Decrypt failed: ' + entry?.name + ' — ' + e.message, 'err', 5000);
        }
    }

    /* Recursively decrypt all encrypted files inside selected directories */
    for (const i of dirIndices)
    {
        const entry = S.files[i];
        S.loadMsg   = `DECRYPTING DIR: ${entry.name}…`;
        render();
        try
        {
            const n = await decryptDirRecursive(entry.handle, S.sessionKey);
            ok += n;
        }
        catch (e)
        {
            toast('Decrypt dir failed: ' + entry.name + ' — ' + e.message, 'err', 5000);
        }
    }

    S.selectedSet = new Set();
    S.files       = await vaultList(S.currentDir);
    S.loading     = false;
    render();
    if (ok > 0) { toast(`Decrypted ${ok} file${ok !== 1 ? 's' : ''} in place.`, 'ok'); }
}

/**
 * Mark or unmark a file as hidden (stored in prefs, no filesystem rename).
 * Directories cannot be hidden via this mechanism.
 * @param {number}  i     Index into S.files.
 * @param {boolean} hide  True to hide, false to unhide.
 */
async function actHide(i, hide)
{
    const entry = S.files[i];
    if (!entry || entry.kind === 'dir') { return; } /* Directories cannot be hidden */

    const cpk = computePathKey(S.breadcrumb, S.currentDir);
    const fp  = (cpk === '') ? entry.name : cpk + '/' + entry.name;

    if (hide) { S.hiddenFiles.add(fp); }
    else      { S.hiddenFiles.delete(fp); }

    savePrefs();

/** Open the bulk-delete confirmation modal for all selected items. */

    if (!indices.length) { return; }

    render();
}

/**
 * Permanently delete a list of files/directories.
 * Directories are removed recursively and purged from the tree cache.
 * @param {number[]} indices  Array of S.files indices to delete.
 */
async function doDelete(indices)
{
    const items = indices.map(i => S.files[i]).filter(Boolean);
    let done = 0;

    for (const entry of items)
    {
        try
        {
            /* removeEntry with recursive:true deletes directories and all their contents */
            await S.currentDir.removeEntry(entry.name, { recursive: true });

            if (entry.kind === 'dir')
            {
                /* Purge the deleted directory and all its descendants from the tree cache */
                const pk = computePathKey(S.breadcrumb, S.currentDir);
                const dk = (pk === '') ? entry.name : pk + '/' + entry.name;
                for (const k of Object.keys(S.treeNodes))
                {
                    if (k === dk || k.startsWith(dk + '/'))
                    {
                        delete S.treeNodes[k];
                        delete S.treeHandles[k];
                        S.treeExpanded.delete(k);
                    }
                }
                delete S.treeNodes[pk];
                await treeLoad(pk, S.currentDir);
            }
            done++;
        }
        catch (e)
        {
            toast('Delete failed: ' + entry.name + ' — ' + e.message, 'err', 5000);
        }
    }

    S.selectedSet = new Set();
    S.files       = await vaultList(S.currentDir);
    render();
    toast(`Deleted ${done} item${done !== 1 ? 's' : ''}.`, 'ok');
}

/**
 * Bulk-download all selected files.
 * Encrypted files are decrypted on the fly before triggering the download.
 */
async function actBulkDownload()
{
    const indices = [...S.selectedSet].filter(i => S.files[i]?.kind === 'file');
    if (!indices.length)
    {
        toast('Select file(s) to download.', 'inf');
        return;
    }
    toast(`Decrypting ${indices.length} file(s)…`, 'inf');
    let done = 0;
    for (const i of indices)
    {
        const entry = S.files[i];
        try
        {
            const buf = await vaultRead(entry, S.sessionKey);
            if (entry.encrypted) { statsRecord('dec', true); }
            dlBlob(buf, entry.name);
            addRecent(computePathKey(S.breadcrumb, S.currentDir), entry.name);
            done++;
        }
        catch (e)
        {
            if (entry.encrypted) { statsRecord('dec', false); }
            toast('Failed: ' + entry.name + ' — ' + e.message, 'err', 5000);
        }
    }
    if (done > 0) { toast(`Downloaded ${done} file${done !== 1 ? 's' : ''}.`, 'ok'); }
}

/**
 * Download a single file by index.
 * Plain files are downloaded directly; encrypted files are decrypted first.
 */
async function actDownload(i)
{
    const entry = S.files[i];
    if (!entry || entry.kind === 'dir') { return; }

    if (!entry.encrypted)
    {
        /* Plain file: read raw bytes and download directly */
        try
        {
            const buf = await (await entry.handle.getFile()).arrayBuffer();
            dlBlob(buf, entry.name);
            addRecent(computePathKey(S.breadcrumb, S.currentDir), entry.name);
            toast('Downloaded: ' + entry.name, 'ok');
        }
        catch (err)
        {
            toast('Download failed: ' + err.message, 'err', 6000);
        }
        return;
    }

    /* Encrypted file: decrypt then download */
    toast('Decrypting ' + entry.name + '…', 'inf');
    try
    {
        const buf = await vaultRead(entry, S.sessionKey);
        statsRecord('dec', true);
        dlBlob(buf, entry.name);
        addRecent(computePathKey(S.breadcrumb, S.currentDir), entry.name);
        toast('Downloaded: ' + entry.name, 'ok');
    }
    catch (err)
    {
        statsRecord('dec', false);
        toast('Decryption failed: ' + err.message, 'err', 6000);
    }
}

/**
 * Open (preview) a file in a new browser tab.
 * Known MIME types are opened inline; unknown types fall back to download.
 * Blob URL is revoked after 60 seconds to free memory.
 */
async function actOpenFile(i)
{
    const entry = S.files[i];
    if (!entry || entry.kind === 'dir') { return; }

    /* MIME type map: extension → Content-Type */
    const MIME = {
        pdf:'application/pdf',
        jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', gif:'image/gif',
        webp:'image/webp', svg:'image/svg+xml', bmp:'image/bmp',
        mp4:'video/mp4', mkv:'video/x-matroska', mov:'video/quicktime',
        avi:'video/x-msvideo', wmv:'video/x-ms-wmv',
        mp3:'audio/mpeg', wav:'audio/wav', ogg:'audio/ogg', flac:'audio/flac',
        aac:'audio/aac', m4a:'audio/mp4',
        txt:'text/plain;charset=utf-8', log:'text/plain;charset=utf-8',
        md:'text/plain;charset=utf-8',  py:'text/plain;charset=utf-8',
        js:'text/plain;charset=utf-8',  ts:'text/plain;charset=utf-8',
        sh:'text/plain;charset=utf-8',  bat:'text/plain;charset=utf-8',
        ps1:'text/plain;charset=utf-8', c:'text/plain;charset=utf-8',
        cpp:'text/plain;charset=utf-8', cs:'text/plain;charset=utf-8',
        java:'text/plain;charset=utf-8',go:'text/plain;charset=utf-8',
        rs:'text/plain;charset=utf-8',  rb:'text/plain;charset=utf-8',
        yaml:'text/plain;charset=utf-8',yml:'text/plain;charset=utf-8',
        toml:'text/plain;charset=utf-8',ini:'text/plain;charset=utf-8',
        cfg:'text/plain;charset=utf-8', env:'text/plain;charset=utf-8',
        csv:'text/plain;charset=utf-8', sql:'text/plain;charset=utf-8',
        json:'text/plain;charset=utf-8',xml:'text/plain;charset=utf-8',
    };

    try
    {
        let buf;
        if (entry.encrypted)
        {
            toast('Decrypting ' + entry.name + '…', 'inf');
            buf = await vaultRead(entry, S.sessionKey);
            statsRecord('dec', true);
        }
        else
        {
            /* Plain file — read raw bytes directly, no decryption needed */
            buf = await (await entry.handle.getFile()).arrayBuffer();
        }

        const ext = (entry.name.split('.').pop() || '').toLowerCase();
        addRecent(computePathKey(S.breadcrumb, S.currentDir), entry.name);

        const mime = MIME[ext];
        if (!mime)
        {
            /* Unknown type — fall back to download */
            dlBlob(buf, entry.name);
            toast('Downloaded: ' + entry.name, 'ok');
            return;
        }

        /* Create a temporary blob URL and open in a new tab */
        const url = URL.createObjectURL(new Blob([buf], { type: mime }));
        const tab = window.open(url, '_blank');

        if (!tab)
        {
            /* Popup blocked by browser — fall back to download */
            URL.revokeObjectURL(url);
            dlBlob(buf, entry.name);
            toast('Popup blocked — downloaded: ' + entry.name, 'inf', 4000);
        }
        else
        {
            /* Revoke the blob URL after 60 seconds to free memory */
            setTimeout(() => URL.revokeObjectURL(url), 60000);
            toast('Opened: ' + entry.name, 'ok');
        }
    }
    catch (err)
    {
        if (entry.encrypted) { statsRecord('dec', false); }
        toast('Decryption failed: ' + err.message
            + (S.vaultHasMasterKey ? '' : ' — If your vault was recently re-configured, use Options → Upgrade to Master Key and provide a backup .dcconfig from OneDrive version history.'),
            'err', 9000);
    }
}

/** Handle drag-and-drop of files onto the content pane. */

/**
 * Pre-flight check before encrypting and storing files.
 * If any filename already exists, show the overwrite-confirmation modal.
 */
async function processFiles(files)
{
    if (!files.length) { return; }

    const existing = [];
    for (const f of files)
    {
        try
        {
            await S.currentDir.getFileHandle(f.name);
            existing.push(f.name); /* File already exists in vault */
        }
        catch { /* File doesn't exist — safe to write */ }
    }

    if (existing.length)
    {
        /* Ask user what to do about conflicting filenames */
        S.modal = { type: 'confirmOverwrite', existing, files, err: null };
        render();
        return;
    }

    await encryptAndStore(files);
}

/**
 * Encrypt and store an array of File objects in the current vault directory.
 * Each file is encrypted with the DCR3 format using the session key.
 */
async function encryptAndStore(files)
{
    if (!files.length) { return; }

    S.loading = true;
    S.loadMsg = `ENCRYPTING 0 / ${files.length}…`;
    render();

    let done = 0;
    const errs = [];

    for (const f of files)
    {
        /* Update the overlay message with the current file name */
        const msg = document.getElementById('ov-msg');
        if (msg) { msg.textContent = `ENCRYPTING ${done + 1} / ${files.length}: ${f.name}`; }

        try
        {
            await vaultWrite(S.currentDir, S.sessionKey, f);
            done++;
        }
        catch (err)
        {
            errs.push(f.name + ': ' + err.message);
        }
    }

    S.loading = false;
    S.files   = await vaultList(S.currentDir);
    render();

    if (errs.length)
    {
        toast(`Saved ${done} of ${files.length}. Errors: ${errs.join('; ')}`, 'err', 8000);
    }
    else
    {
        toast(`✓ ${done} file${done !== 1 ? 's' : ''} encrypted and stored.`, 'ok');
    }
}

/**
 * Navigate into a directory (double-click or tree click).
 * Pushes the current directory onto the breadcrumb stack.
 */
async function actNavigateIn(i)
{
    const entry = S.files[i];
    if (!entry || entry.kind !== 'dir') { return; }

    _navPush();
    const ok = computePathKey(S.breadcrumb, S.currentDir);
    S.treeExpanded.add(ok);
    S.breadcrumb.push({ name: S.currentDir.name, handle: S.currentDir });
    S.currentDir = entry.handle;

    const nk = computePathKey(S.breadcrumb, S.currentDir);
    S.treeHandles[nk] = entry.handle;
    await treeLoad(nk, entry.handle);
    S.files       = await vaultList(S.currentDir);
    S.searchQuery = '';
    render();
}

/** Navigate to a breadcrumb segment (click on address bar). */
async function actNavigateBread(i)
{
    _navPush();
    const target  = S.breadcrumb[i];
    S.breadcrumb  = S.breadcrumb.slice(0, i);
    S.currentDir  = target.handle;
    S.files       = await vaultList(S.currentDir);
    S.searchQuery = '';
    render();
}

/** Navigate up one directory level. */
async function actNavUp()
{
    if (S.breadcrumb.length === 0) { return; }
    await actNavigateBread(S.breadcrumb.length - 1);
}

/**
 * Snapshot the current location onto the back stack before a navigation.
 * Always clears the forward stack — identical to browser behaviour.
 */
function _navPush()
{
    S.navBack.push({ breadcrumb: S.breadcrumb.map(b => ({ ...b })), currentDir: S.currentDir });
    S.navForward = [];
}

/** Navigate back to the previous location (Alt+Left). */
async function actNavBack()
{
    if (S.navBack.length === 0) { return; }
    S.navForward.push({ breadcrumb: S.breadcrumb.map(b => ({ ...b })), currentDir: S.currentDir });
    const prev    = S.navBack.pop();
    S.breadcrumb  = prev.breadcrumb;
    S.currentDir  = prev.currentDir;
    S.files       = await vaultList(S.currentDir);
    S.searchQuery = '';
    render();
}

/** Navigate forward — re-applies a navigation undone by Back (Alt+Right). */
async function actNavForward()
{
    if (S.navForward.length === 0) { return; }
    S.navBack.push({ breadcrumb: S.breadcrumb.map(b => ({ ...b })), currentDir: S.currentDir });
    const next    = S.navForward.pop();
    S.breadcrumb  = next.breadcrumb;
    S.currentDir  = next.currentDir;
    S.files       = await vaultList(S.currentDir);
    S.searchQuery = '';
    render();
}

/** Navigate directly to the vault root. */
async function actNavHome()
{
    if (S.breadcrumb.length === 0) { return; }
    _navPush();
    S.breadcrumb  = [];
    S.currentDir  = S.vaultDir;
    S.files       = await vaultList(S.vaultDir);
    S.searchQuery = '';
    render();
}

/** Expand or collapse a tree node. */
async function actTreeToggle(tkey)
{
    if (S.treeExpanded.has(tkey))
    {
        S.treeExpanded.delete(tkey);
        render();
    }
    else
    {
        const handle = S.treeHandles[tkey];
        if (handle)
        {
            await treeLoad(tkey, handle);
            S.treeExpanded.add(tkey);
        }
        render();
    }
}

/** Navigate to a directory via its tree path key (clicking in the left pane). */
async function actTreeNav(tkey)
{
    const cpk    = computePathKey(S.breadcrumb, S.currentDir);
    if (tkey === cpk) { return; } /* Already here */
    _navPush();
    const handle = S.treeHandles[tkey] || await resolvePathKey(tkey);
    if (!handle) { toast('Folder not found.', 'err'); return; }

    /* Reconstruct the breadcrumb trail from the path key parts */
    const parts = (tkey === '') ? [] : tkey.split('/');
    const bc    = (parts.length > 0) ? [{ name: S.vaultDir.name, handle: S.vaultDir }] : [];
    for (let i = 0; i < parts.length - 1; i++)
    {
        const pk = parts.slice(0, i + 1).join('/');
        bc.push({ name: parts[i], handle: S.treeHandles[pk] || handle });
    }

    S.breadcrumb  = bc;
    S.currentDir  = handle;

    /* Collapse everything, then expand only the ancestors of the new target */
    S.treeExpanded = new Set();
    for (let i = 0; i <= parts.length; i++)
    {
        const ancestorKey = parts.slice(0, i).join('/');
        S.treeExpanded.add(ancestorKey);
        const ah = S.treeHandles[ancestorKey] || await resolvePathKey(ancestorKey);
        if (ah) { await treeLoad(ancestorKey, ah); }
    }

    S.files       = await vaultList(handle);
    S.searchQuery = '';
    render();
}

/**
 * Resolve a path key (e.g. "Documents/Work") to a FileSystemDirectoryHandle
 * by walking the vault directory tree from the root.
 * Results are cached in S.treeHandles.
 */
async function resolvePathKey(pk)
{
    if (pk === '') { return S.vaultDir; }

    const parts = pk.split('/').filter(Boolean);
    let dir = S.vaultDir;
    let key = '';

    for (const part of parts)
    {
        const ck = (key === '') ? part : key + '/' + part;
        if (S.treeHandles[ck])
        {
            dir = S.treeHandles[ck]; /* Use cached handle */
        }
        else
        {
            try
            {
                dir = await dir.getDirectoryHandle(part);
                S.treeHandles[ck] = dir; /* Cache for future use */
            }
            catch
            {
                return null; /* Path segment doesn't exist */
            }
        }
        key = ck;
    }
    return dir;
}

/** Navigate to the directory containing a recently opened file, then select it. */
async function actRecentNav(i)
{
    const ref = S.recentFiles[i];
    if (!ref) { return; }

    const handle = await resolvePathKey(ref.pathKey);
    if (!handle) { toast('Folder no longer exists.', 'err'); return; }

    S.treeHandles[ref.pathKey] = handle;
    await actTreeNav(ref.pathKey);

    /* Find the file in the refreshed listing and select it */
    const idx = S.files.findIndex(f => f.name === ref.name && f.kind === 'file');
    if (idx >= 0)
    {
        S.selectedSet = new Set([idx]);
        render();
        /* Scroll the selected row into view after a short delay */
        setTimeout(() =>
        {
            document.querySelector(`[data-i="${idx}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
    }
}

/** Toggle a directory's favourite status and persist to prefs. */
function actToggleFav(key, name)
{
    const idx = S.favourites.findIndex(f => f.key === key);
    if (idx >= 0)

        /* Already a favourite — remove it */
        S.favourites.splice(idx, 1);
        toast('Removed from Favourites.', 'inf');

    else

        /* Add to favourites */
        S.favourites.push({ key, name });
        toast('Favourited: ' + name, 'ok');

    savePrefs();
    render();
}

/**
 * Open an emoji icon picker modal for a directory row.
 * Clicking an emoji saves it to S.dirIcons[key] and persists to prefs.
 * The current icon (if any) is highlighted and a "remove" button is shown.
 *
 * @param {number} idx   Index of the directory in S.files (reserved for future use).
 * @param {string} key   Path key for the directory (used as the dirIcons map key).
 */
function openDirIconPicker(idx, key)
{
    const cur = S.dirIcons[key] || ''; /* Currently assigned emoji, or empty */

    /* Build one HTML section per icon group */
    const groups = DIR_ICON_GROUPS.map(g =>
        `<div style="margin-bottom:10px">
            <div style="font-size:8px;letter-spacing:2px;color:rgba(255,255,255,.3);font-family:var(--ff-mono);margin-bottom:5px">
                ${g.label.toUpperCase()}
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:4px">
                ${g.icons.map(em =>
                    `<button class="dir-icon-btn" data-em="${em}" title="${em}"
                        style="font-size:20px;
                               background:${em === cur ? 'rgba(0,210,255,.2)' : 'rgba(255,255,255,.04)'};
                               border:1px solid ${em === cur ? 'rgba(0,210,255,.5)' : 'rgba(255,255,255,.08)'};
                               border-radius:5px;padding:4px 6px;cursor:pointer;transition:background .1s">
                        ${em}
                    </button>`
                ).join('')}
            </div>
        </div>`
    ).join('');

    /* Create a full-screen overlay */
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;';

    ov.innerHTML =
        `<div style="background:#141414;border:1px solid rgba(0,210,255,.18);border-radius:8px;
                     padding:20px 22px;width:min(460px,96vw);max-height:80vh;
                     overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.8)">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
                <span style="font-family:var(--ff-mono);font-size:11px;letter-spacing:2px;color:rgba(0,210,255,.8)">CHOOSE DIRECTORY ICON</span>
                <button id="dip-close" style="background:transparent;border:none;color:rgba(255,255,255,.4);cursor:pointer;font-size:16px">&#10005;</button>
            </div>
            ${groups}
            ${cur ?
                `<div style="margin-top:8px;border-top:1px solid rgba(255,255,255,.07);padding-top:10px">
                    <button id="dip-clear" style="font-size:10px;font-family:var(--ff-mono);background:transparent;
                        border:1px solid rgba(255,82,82,.3);color:rgba(255,82,82,.7);
                        border-radius:3px;padding:4px 10px;cursor:pointer;letter-spacing:1px">REMOVE ICON</button>
                </div>`
            : ''}
        </div>`;

    document.body.appendChild(ov);

    /* Attach icon selection handlers */
    ov.querySelectorAll('.dir-icon-btn').forEach(btn =>
    {
        btn.addEventListener('click', () =>
        {
            S.dirIcons[key] = btn.dataset.em;
            savePrefs();
            ov.remove();
            render();
        });
    });

    /* Close button */
    ov.querySelector('#dip-close')?.addEventListener('click', () => ov.remove());

    /* Remove icon button (only shown when a current icon exists) */
    ov.querySelector('#dip-clear')?.addEventListener('click', () =>
    {
        delete S.dirIcons[key];
        savePrefs();
        ov.remove();
        render();
    });

    /* Click-outside to dismiss */
    ov.addEventListener('click', e => { if (e.target === ov) { ov.remove(); } });
}

/** Toggle selection of all files (not directories) in the current view. */
function actSelectAll()
{
    const fis = S.files.map((f, i) => f.kind === 'file' ? i : -1).filter(i => i >= 0);
    const all = fis.length > 0 && fis.every(i => S.selectedSet.has(i));

    if (all) { S.selectedSet.clear(); }         /* All selected — deselect all */
    else     { S.selectedSet = new Set(fis); }  /* Otherwise select all files */
    render();
}

/**
 * Change the vault passphrase.
 * Verifies the old passphrase, re-encrypts the config with the new one,
 * and updates the in-memory session key.
 *
 * @param {string} oldPp  Current passphrase (verified against stored config).
 * @param {string} newPp  New passphrase to set.
 * @returns {Promise<string|null>}  Error message on failure, null on success.
 */
async function actChangePassphrase(oldPp, newPp)
{
    /* Verify the old passphrase by attempting to load the config with it */
    const res = await cfgLoad(S.vaultDir, oldPp);
    if (!res) { return 'Incorrect current passphrase.'; }
    const { cfg } = res;

    S.loading = true;
    S.loadMsg = 'UPDATING PASSPHRASE…';
    render();

    try
    {
        /* Re-encrypt the config record with the new passphrase */
        const newKey = await cfgSave(S.vaultDir, newPp, cfg);
        S.sessionKey = newKey; /* Swap in the new derived key immediately */
        S.loading    = false;
        render();
        return null; /* Success */
    }
    catch (e)
    {
        S.loading = false;
        render();
        return e.message;
    }
}

/**
 * Update (or clear) the login hint stored in the vault.
 * The hint is shown on the login screen to help the user remember their passphrase.
 * @param {string} newHint  New hint text, or empty string to remove the hint.
 */
async function actChangeHint(newHint)
{
    await hintSave(S.vaultDir, newHint);
    S.hint = newHint || null;
    toast(newHint ? 'Login hint updated.' : 'Login hint removed.', 'ok');
}
