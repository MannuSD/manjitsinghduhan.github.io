<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'none'; object-src 'none'">
  <title>NimKu Vault — Secure Vault</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --void:       #1c1c1c;
      --deep:       #181818;
      --surface:    #272727;
      --panel:      rgba(255,255,255,.04);
      --pb:         rgba(255,255,255,.1);
      --pb-bright:  rgba(255,255,255,.25);
      --cyan:       #0078d4;
      --cyan-b:     #4ca6e8;
      --cyan-dim:   rgba(0,120,212,.5);
      --cyan-glow:  none;
      --blue:       #0078d4;
      --purple:     #8764b8;
      --green:      #6ccb5f;
      --red:        #e74856;
      --yellow:     #f7c948;
      --text:       #d4d4d4;
      --text-b:     #f3f3f3;
      --text-dim:   #888888;
      --muted:      #333333;
      --ff-mono:    'Consolas', 'Courier New', monospace;
      --ff-ui:      'Segoe UI Variable', 'Segoe UI', system-ui, -apple-system, sans-serif;
      --shadow:     0 8px 32px rgba(0,0,0,.5);
      --r:          4px;
    }

    html, body { height: 100%; font-family: var(--ff-ui); background: var(--void); color: var(--text); font-size: 14px; line-height: 1.5; overflow-x: hidden; }
    body.auth-view { background: #030305; }

    /* ── BACKGROUND — visible on auth pages, hidden on explorer ── */
    #nmk-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .bg-grid  { display: none; }
    .bg-glows { display: none; }
    .bg-star  { display: none; position: absolute; border-radius: 50%; background: #fff; }
    /* far: tiny, slow directional drift */
    .bg-star.s-far  { animation: starDrift var(--dur) var(--del) linear infinite; }
    /* mid: medium, twinkle while drifting */
    .bg-star.s-mid  { animation: starDriftTwinkle var(--dur) var(--del) ease-in-out infinite; }
    /* near: large, fast, fade in and out as they streak past */
    .bg-star.s-near { animation: starDriftFade var(--dur) var(--del) linear infinite; }
    body.auth-view .bg-star { display: block; }
    @keyframes starTwinkle { 0%{opacity:var(--op-lo);transform:scale(.8);}100%{opacity:var(--op-hi);transform:scale(1.3);} }
    @keyframes starDrift {
      0%   { opacity: var(--op-lo); transform: translate(0,0); }
      15%  { opacity: var(--op-hi); }
      85%  { opacity: var(--op-hi); }
      100% { opacity: var(--op-lo); transform: translate(var(--tx),var(--ty)); }
    }
    @keyframes starDriftTwinkle {
      0%   { opacity: var(--op-lo); transform: translate(0,0) scale(.8); }
      20%  { opacity: var(--op-hi); transform: translate(calc(var(--tx)*.2),calc(var(--ty)*.2)) scale(1.35); }
      75%  { opacity: var(--op-hi); transform: translate(calc(var(--tx)*.75),calc(var(--ty)*.75)) scale(1.05); }
      100% { opacity: var(--op-lo); transform: translate(var(--tx),var(--ty)) scale(.8); }
    }
    @keyframes starDriftFade {
      0%   { opacity: 0; transform: translate(0,0) scale(.5); }
      10%  { opacity: var(--op-hi); transform: translate(calc(var(--tx)*.1),calc(var(--ty)*.1)) scale(1.3); }
      88%  { opacity: calc(var(--op-hi)*.4); }
      100% { opacity: 0; transform: translate(var(--tx),var(--ty)) scale(1.8); }
    }
    @keyframes constFade { from{opacity:0;} to{opacity:1;} }
    /* shooting stars — head+tail meteors */
    .bg-shoot {
      position: absolute; height: 2px;
      border-radius: 0 50% 50% 0;
      transform-origin: left center;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(255,255,255,.02) 20%,
        rgba(255,255,255,.2) 50%,
        rgba(255,255,255,.8) 82%,
        rgba(255,255,255,1) 93%,
        rgba(200,230,255,.7) 100%);
      filter: drop-shadow(1px 0 6px rgba(255,255,255,.8)) drop-shadow(1px 0 18px rgba(180,220,255,.4));
      animation: shootStar var(--dur) var(--del) linear infinite; opacity: 0;
    }
    @keyframes shootStar {
      0%   { opacity: 0; width: 0;          transform: rotate(var(--ang)) translateX(0); }
      3%   { opacity: 0; }
      7%   { opacity: 1; width: var(--len); }
      78%  { opacity: .55; width: var(--len); }
      92%  { opacity: 0;   width: var(--len); transform: rotate(var(--ang)) translateX(var(--travel)); }
      100% { opacity: 0;   width: 0;          transform: rotate(var(--ang)) translateX(var(--travel)); }
    }
    /* polygons — rotate + float through space independently */
    .bg-poly {
      position: absolute; pointer-events: none;
      animation: polyRotate var(--dur) var(--del) linear infinite,
                 polyFloat 28s var(--fdel,0s) ease-in-out infinite alternate;
      opacity: var(--op);
      filter: drop-shadow(0 0 var(--glow-r) var(--glow-c));
    }
    .bg-poly-ccw {
      position: absolute; pointer-events: none;
      animation: polyRotateCCW var(--dur) var(--del) linear infinite,
                 polyFloat 28s var(--fdel,0s) ease-in-out infinite alternate;
      opacity: var(--op);
      filter: drop-shadow(0 0 var(--glow-r) var(--glow-c));
    }
    @keyframes polyRotate    { from { transform: rotate(0deg); }  to { transform: rotate(360deg);  } }
    @keyframes polyRotateCCW { from { transform: rotate(0deg); }  to { transform: rotate(-360deg); } }
    @keyframes polyFloat {
      0%   { translate: 0px 0px; }
      25%  { translate: var(--pdx) var(--pdy); }
      50%  { translate: calc(var(--pdx)*-.4) calc(var(--pdy)*1.3); }
      75%  { translate: calc(var(--pdx)*-1.1) calc(var(--pdy)*.2); }
      100% { translate: 0px 0px; }
    }
    /* warp lines */
    .bg-warp {
      position: absolute; top: 50%; left: 50%;
      height: 1px; transform-origin: left center;
      background: linear-gradient(90deg, transparent 0%, rgba(0,210,255,.0) 60%, rgba(0,210,255,.5) 80%, transparent 100%);
      animation: warpLine var(--dur) var(--del) linear infinite; opacity: 0;
    }
    @keyframes warpLine {
      0%   { opacity: 0; width: 0; }
      5%   { opacity: .6; }
      50%  { opacity: .2; width: var(--len); }
      80%  { opacity: 0; width: var(--len); }
      100% { opacity: 0; }
    }
    /* nebula */
    .bg-nebula {
      position: absolute; border-radius: 50%;
      animation: nebulaPulse var(--dur) var(--del) ease-in-out infinite alternate;
      filter: blur(60px);
    }
    @keyframes nebulaPulse { 0% { opacity: .04; transform: scale(1); } 100% { opacity: .1; transform: scale(1.08); } }
    .bg-particle {
      position: absolute; width: 2px; height: 2px;
      background: rgba(255,255,255,.85); border-radius: 50%;
      animation: bgParticle var(--dur) var(--del) linear infinite; opacity: 0;
    }
    @keyframes bgGridDrift { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(70px) rotate(.4deg); } }
    @keyframes bgParticle {
      0%   { opacity: 0; transform: translate(0,0) scale(.6); }
      8%   { opacity: var(--op); }
      92%  { opacity: calc(var(--op) * .4); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.4); }
    }

    /* ── SCAN LINE ── */
    .scan-line {
      position: fixed; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--cyan-dim) 30%, var(--cyan) 50%, var(--cyan-dim) 70%, transparent 100%);
      animation: scanMove 6s linear infinite; pointer-events: none; z-index: 1;
    }
    @keyframes scanMove { 0% { top: -1px; opacity: 0; } 3% { opacity: 1; } 97% { opacity: 1; } 100% { top: 100vh; opacity: 0; } }

    /* ── SCREEN CORNERS ── */
    .sc-corner { display: none; }

    /* ── AUTH PAGES ── */
    .auth-page { position: relative; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 3; }

    .auth-card {
      position: relative; width: 100%; max-width: 460px;
      background: rgba(1,10,22,.55);
      border: 1px solid rgba(0,210,255,.2); border-radius: var(--r);
      padding: 48px 44px 44px;
      box-shadow: var(--shadow), 0 0 80px rgba(0,210,255,.04), inset 0 1px 0 rgba(0,210,255,.08);
      backdrop-filter: blur(20px); overflow: hidden;
    }
    .auth-card-wide { max-width: 560px; }
    .auth-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      animation: topLinePulse 3s ease-in-out infinite alternate;
    }
    @keyframes topLinePulse { 0% { opacity: .25; } 100% { opacity: .9; } }
    .auth-card-sweep {
      position: absolute; left: 0; right: 0; height: 100px;
      background: linear-gradient(180deg, transparent, rgba(0,210,255,.025), transparent);
      animation: cardSweep 7s linear infinite; pointer-events: none;
    }
    @keyframes cardSweep { 0% { top: -100px; } 100% { top: 100%; } }

    .card-corner { display: none; }
    .card-dot { display: none; }

    /* ── SCREEN-CORNER IRON BOLTS ── */
    .sc-corner .bolt {
      position: absolute; width: 30px; height: 30px; border-radius: 60%; pointer-events: none;
      background: radial-gradient(circle at 36% 30%,
        #d4d4d4 0%, #a8a8a8 15%, #6a6a6a 35%, #3c3c3c 60%, #1a1a1a 100%);
      box-shadow:
        inset 0 2px 5px rgba(255,255,255,.22),
        inset 0 -2px 5px rgba(0,0,0,.9),
        0 5px 12px rgba(0,0,0,.8),
        0 2px 4px rgba(0,0,0,.95),
        0 0 0 1px rgba(0,0,0,.55);
    }
    .sc-corner .bolt::before, .sc-corner .bolt::after {
      content: ''; position: absolute; top: 50%; left: 50%;
      background: rgba(0,0,0,.78); border-radius: 1px;
    }
    .sc-corner .bolt::before { width: 12px; height: 3px; transform: translate(-50%,-50%); box-shadow: 0 1px 0 rgba(255,255,255,.07); }
    .sc-corner .bolt::after  { width: 3px; height: 12px; transform: translate(-50%,-50%); }
    /* Bolt sits at the inner elbow where the two L-bracket lines meet — lines radiate outward from it */
    .sc-corner.tl .bolt { bottom: -1px; right: -1px; }
    .sc-corner.tr .bolt { bottom: -1px; left:  -1px; }
    .sc-corner.bl .bolt { top:    -1px; right: -1px; }
    .sc-corner.br .bolt { top:    -1px; left:  -1px; }

    /* ── LOGO ── */
    .nmk-logo-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 26px; }
    .nmk-svg-wrap { position: relative; width: 86px; height: 86px; margin-bottom: 16px; }
    .nmk-svg-wrap .ring-pulse {
      position: absolute; border-radius: 50%; border: 1px solid var(--cyan);
      animation: ringOut 2.4s ease-out infinite;
    }
    .nmk-svg-wrap .ring-pulse:nth-child(2) { animation-delay: .8s; }
    .nmk-svg-wrap .ring-pulse:nth-child(3) { animation-delay: 1.6s; }
    @keyframes ringOut { 0% { inset: 38px; opacity: .7; } 100% { inset: -20px; opacity: 0; } }
    /* HUD logo wrap — 32px */
    .hud-logo-wrap { position: relative; width: 32px; height: 32px; flex-shrink: 0; }
    .hud-logo-wrap .ring-pulse { position: absolute; border-radius: 50%; border: 1px solid rgba(0,210,255,.7); animation: ringOutHud 2.4s ease-out infinite; }
    .hud-logo-wrap .ring-pulse:nth-child(2) { animation-delay: .8s; }
    @keyframes ringOutHud { 0% { inset: 14px; opacity: .8; } 100% { inset: -10px; opacity: 0; } }
    .nmk-svg { position: relative; z-index: 1; filter: drop-shadow(0 0 8px rgba(0,210,255,.5)); }
    .svg-hex-outer { transform-origin: 50% 50%; transform-box: fill-box; animation: hexCW 28s linear infinite; }
    .svg-hex-inner { transform-origin: 50% 50%; transform-box: fill-box; animation: hexCCW 18s linear infinite; }
    .svg-dot-glow  { animation: dotGlow 2s ease-in-out infinite alternate; }
    @keyframes hexCW  { from { transform: rotate(0deg); }   to { transform: rotate(360deg); }  }
    @keyframes hexCCW { from { transform: rotate(0deg); }   to { transform: rotate(-360deg); } }
    @keyframes dotGlow { 0% { opacity: .5; } 100% { opacity: 1; } }

    .corp-name {
      font-family: var(--ff-mono); font-size: 26px; font-weight: 700; letter-spacing: 6px;
      text-align: center; position: relative; display: inline-block;
      background: linear-gradient(110deg,
        #daf0ff 0%, #daf0ff 30%,
        #00d2ff 42%, #a0f0ff 48%, #ffffff 52%, #a0f0ff 56%,
        #00d2ff 62%, #daf0ff 70%, #daf0ff 100%);
      background-size: 250% auto;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmerName 4s linear infinite;
      filter: drop-shadow(0 0 18px rgba(0,210,255,.45));
    }
    @keyframes shimmerName {
      0%   { background-position: 200% center; }
      100% { background-position: -50% center; }
    }
    .corp-tagline { font-family: var(--ff-mono); font-size: 11px; letter-spacing: 3px; color: var(--text-dim); text-transform: uppercase; margin-top: 6px; text-align: center; }

    /* ── DIVIDER ── */
    .auth-divider { display: flex; align-items: center; gap: 10px; margin: 20px 0; }
    .auth-divider::before { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(0,210,255,.25)); }
    .auth-divider::after  { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(0,210,255,.25), transparent); }
    .auth-div-txt { font-family: var(--ff-mono); font-size: 8px; letter-spacing: 3px; color: var(--text-dim); text-transform: uppercase; white-space: nowrap; }

    /* ── STATUS LINE ── */
    .status-line { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; font-family: var(--ff-ui); font-size: 13px; letter-spacing: 0; color: var(--text-dim); }
    .dot-blink { display: inline-block; width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .dot-blink.green { background: var(--green); box-shadow: 0 0 8px var(--green); animation: blinkGreen 2s ease-in-out infinite; }
    .dot-blink.red   { background: var(--red);   box-shadow: 0 0 8px var(--red);   animation: blinkRed 1s ease-in-out infinite; }
    @keyframes blinkGreen { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    @keyframes blinkRed   { 0%,100% { opacity: 1; } 50% { opacity: .2; } }

    /* ── LOGIN FORM ── */
    .auth-lbl { display: block; font-family: var(--ff-mono); font-size: 11px; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 10px; }
    .auth-inp-wrap { position: relative; margin-bottom: 18px; }
    .auth-inp-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 13px; pointer-events: none; line-height: 1; }
    .auth-inp {
      width: 100%; background: rgba(0,210,255,.04); border: 1px solid rgba(0,210,255,.18);
      border-radius: var(--r); padding: 15px 16px 15px 46px;
      color: var(--text-b); font-family: var(--ff-mono); font-size: 16px;
      letter-spacing: 2px; outline: none; transition: all .2s;
    }
    .auth-inp::placeholder { color: var(--text-dim); letter-spacing: 1px; font-size: 14px; }
    .auth-inp:focus { border-color: var(--cyan); background: rgba(0,210,255,.07); box-shadow: 0 0 0 1px rgba(0,210,255,.15), 0 0 24px rgba(0,210,255,.1); }

    /* ── HINT REVEAL ── */
    .hint-reveal {
      display: none; position: relative;
      background: rgba(255,208,64,.05); border: 1px solid rgba(255,208,64,.22);
      border-left: 2px solid var(--yellow); border-radius: var(--r);
      padding: 10px 14px; margin-bottom: 16px;
      font-family: var(--ff-ui); font-size: 13px; color: var(--yellow); letter-spacing: 0;
      animation: revealFade .3s ease;
    }
    .hint-reveal-lbl { font-family: var(--ff-mono); font-size: 8px; letter-spacing: 2.5px; color: rgba(255,208,64,.45); text-transform: uppercase; margin-bottom: 5px; }
    @keyframes revealFade { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

    /* ── ATTEMPT PIPS ── */
    .attempt-block { margin-bottom: 14px; }
    .attempt-block-lbl { font-family: var(--ff-ui); font-size: 11.5px; letter-spacing: 0; color: var(--red); text-transform: none; margin-bottom: 6px; font-weight: 600; }
    .attempt-pips { display: flex; gap: 5px; }
    .attempt-pip { flex: 1; height: 3px; background: rgba(255,43,74,.1); border-radius: 1px; border: 1px solid rgba(255,43,74,.2); transition: all .3s; }
    .attempt-pip.used { background: var(--red); border-color: var(--red); box-shadow: 0 0 6px rgba(255,43,74,.6); }

    /* ── AUTH BUTTON ── */
    .auth-btn {
      width: 100%; background: transparent; border: 1px solid var(--cyan);
      border-radius: var(--r); padding: 16px 22px; color: var(--cyan);
      font-family: var(--ff-mono); font-size: 14px; font-weight: 700;
      letter-spacing: 5px; text-transform: uppercase; cursor: pointer;
      transition: all .2s; position: relative; overflow: hidden;
    }
    .auth-btn::before { content: ''; position: absolute; inset: 0; background: var(--cyan); opacity: 0; transition: opacity .25s; }
    .auth-btn > * { position: relative; z-index: 1; }
    .auth-btn:hover { box-shadow: var(--cyan-glow); color: var(--cyan-b); }
    .auth-btn:hover::before { opacity: .07; }
    .auth-btn:disabled { opacity: .35; cursor: not-allowed; border-color: var(--text-dim); color: var(--text-dim); }
    .auth-btn span { position: relative; z-index: 1; }

    /* ── LOCKOUT ── */
    .lockout-box { background: rgba(255,43,74,.07); border: 1px solid rgba(255,43,74,.28); border-radius: var(--r); padding: 12px 14px; margin-bottom: 14px; font-family: var(--ff-ui); font-size: 12px; color: var(--red); letter-spacing: 0; text-align: center; }
    .lockout-cd { font-size: 22px; font-weight: 700; letter-spacing: 4px; display: block; margin-top: 4px; text-shadow: 0 0 12px rgba(255,43,74,.6); }

    /* ── UNIVERSAL FORM ── */
    .field { margin-bottom: 18px; text-align: left; }
    label { display: block; font-family: var(--ff-mono); font-size: 9px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; }
    label .hint { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11px; font-family: var(--ff-ui); }
    input[type="password"], input[type="text"] {
      width: 100%; background: rgba(0,210,255,.04); border: 1px solid rgba(0,210,255,.15);
      border-radius: var(--r); padding: 10px 14px; color: var(--text-b);
      font-family: var(--ff-mono); font-size: 13px; outline: none; transition: all .2s;
    }
    textarea {
      width: 100%; background: rgba(0,210,255,.04); border: 1px solid rgba(0,210,255,.15);
      border-radius: var(--r); padding: 10px 14px; color: var(--text-b);
      font-family: var(--ff-ui); font-size: 13px; outline: none; transition: all .2s;
    }
    input:focus, textarea:focus { border-color: var(--cyan); background: rgba(0,210,255,.07); box-shadow: 0 0 0 1px rgba(0,210,255,.12), 0 0 16px rgba(0,210,255,.08); }
    input::placeholder, textarea::placeholder { color: var(--text-dim); }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .strength-bar-wrap { height: 3px; background: rgba(0,210,255,.08); border-radius: 1px; margin-top: 6px; overflow: hidden; }
    .strength-bar { height: 100%; border-radius: 1px; transition: width .3s, background .3s; }
    .strength-lbl { font-size: 10px; margin-top: 4px; font-family: var(--ff-mono); letter-spacing: 1px; }

    /* ── BUTTONS ── */
    button { cursor: pointer; border: none; font-family: inherit; }
    .btn-p { background: transparent; border: 1px solid var(--cyan); border-radius: var(--r); padding: 10px 20px; color: var(--cyan); font-family: var(--ff-mono); font-size: 9.5px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; cursor: pointer; transition: all .2s; position: relative; overflow: hidden; }
    .btn-p::before { content: ''; position: absolute; inset: 0; background: var(--cyan); opacity: 0; transition: opacity .2s; }
    .btn-p:hover { box-shadow: 0 0 18px rgba(0,210,255,.25); }
    .btn-p:hover::before { opacity: .08; }
    .btn-p:disabled { opacity: .35; cursor: not-allowed; }
    .btn-p.full { width: 100%; }
    .btn-p.lg   { padding: 14px 28px; font-size: 10px; }
    .btn-p.sm   { padding: 7px 14px; font-size: 8.5px; letter-spacing: 2px; }
    .btn-g { background: transparent; border: 1px solid rgba(0,210,255,.18); border-radius: var(--r); padding: 10px 20px; color: var(--text-dim); font-family: var(--ff-mono); font-size: 9.5px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; cursor: pointer; transition: all .2s; }
    .btn-g:hover { color: var(--text); border-color: rgba(0,210,255,.35); }
    .btn-g.full { width: 100%; }
    .btn-g.sm   { padding: 7px 14px; font-size: 8.5px; letter-spacing: 2px; }
    .mt { margin-top: 12px; }

    /* ── BOXES ── */
    .err-box  { background: rgba(255,43,74,.07);  border: 1px solid rgba(255,43,74,.28);  border-radius: var(--r); padding: 10px 14px; color: var(--red);  font-family: var(--ff-ui); font-size: 12.5px; letter-spacing: 0; margin: 10px 0; }
    .info-box { background: rgba(0,210,255,.05);   border: 1px solid rgba(0,210,255,.2);   border-radius: var(--r); padding: 10px 14px; color: var(--cyan); font-family: var(--ff-ui); font-size: 12.5px; letter-spacing: 0; margin: 10px 0; }

    /* ── SPINNER ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { display: inline-block; width: 13px; height: 13px; border: 1px solid rgba(0,210,255,.25); border-top-color: var(--cyan); border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 8px; }
    .spin-lg { width: 44px; height: 44px; border: 2px solid rgba(0,210,255,.15); border-top-color: var(--cyan); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 18px; box-shadow: 0 0 24px rgba(0,210,255,.3); }

    /* ── EXPLORER ── */
    .explorer { display: flex; flex-direction: column; height: 100vh; overflow: hidden; position: relative; z-index: 3; }

    /* TOP CHROME */
    .ex-chrome { background: rgba(0,0,0,.38); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,.06); padding: 0 16px; display: flex; align-items: center; justify-content: flex-start; gap: 4px; flex-shrink: 0; min-height: 52px; position: relative; overflow: hidden; }
    .ex-chrome::after { display: none; }
    .hud-block { display: flex; flex-direction: column; justify-content: center; padding: 0 14px; border-right: 1px solid rgba(255,255,255,.07); height: 100%; min-width: 80px; }
    .hud-block:first-child { padding-left: 0; }
    .hud-lbl { font-family: var(--ff-ui); font-size: 11px; font-weight: 400; color: var(--text-dim); letter-spacing: 0; white-space: nowrap; margin-bottom: 1px; }
    .hud-val { font-family: var(--ff-ui); font-size: 14px; font-weight: 600; color: var(--text-b); line-height: 1; white-space: nowrap; }
    .hud-val.green { color: var(--green); }
    .hud-val.red   { color: var(--red); }
    .hud-val.yellow{ color: var(--yellow); }
    .hud-sub { font-family: var(--ff-ui); font-size: 11px; color: var(--text-dim); margin-top: 1px; }
    .hud-dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; margin-right: 3px; vertical-align: middle; }
    .hud-dot.on  { background: var(--green); }
    .hud-dot.off { background: var(--text-dim); }
    .hud-time { margin-left: auto; padding: 0 0 0 14px; border-left: 1px solid rgba(255,255,255,.07); display: flex; flex-direction: column; justify-content: center; align-items: flex-end; height: 100%; }
    .hud-clock { font-family: var(--ff-ui); font-size: 20px; font-weight: 300; color: var(--text-b); letter-spacing: 0; line-height: 1; font-variant-numeric: tabular-nums; min-width: 9ch; text-align: right; }
    .hud-date  { font-family: var(--ff-ui); font-size: 14px; color: var(--text-dim); margin-top: 3px; letter-spacing: 0; text-align: right; }

    .ex-sys { display: flex; align-items: center; gap: 4px; }
    .sys-block { display: flex; flex-direction: column; align-items: flex-end; padding: 0 12px; border-left: 1px solid rgba(0,210,255,.08); }
    .sys-lbl { font-family: var(--ff-mono); font-size: 7px; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 1px; }
    .sys-val { font-family: var(--ff-mono); font-size: 14px; font-weight: 700; letter-spacing: 2px; color: var(--cyan); line-height: 1.1; text-shadow: 0 0 10px rgba(0,210,255,.4); }
    .sys-val.green { color: var(--green); text-shadow: 0 0 10px rgba(0,255,136,.3); }
    .sys-actions { display: flex; align-items: center; gap: 5px; padding-left: 12px; border-left: 1px solid rgba(0,210,255,.08); }

    /* USER MENU */
    .user-menu-wrap { position: relative; display: inline-block; }
    .user-menu-btn { background: transparent; border: 1px solid rgba(0,210,255,.18); border-radius: var(--r); color: var(--text-dim); padding: 5px 10px; cursor: pointer; font-family: var(--ff-mono); font-size: 8.5px; letter-spacing: 2px; text-transform: uppercase; display: inline-flex; align-items: center; gap: 5px; transition: all .15s; }
    .user-menu-btn:hover { color: var(--cyan); border-color: rgba(0,210,255,.4); }

    /* OPTIONS PAGE */
    .opts-overlay { position: fixed; inset: 0; background: rgba(0,4,12,.88); backdrop-filter: blur(6px); z-index: 600; display: flex; align-items: center; justify-content: center; animation: fadeIn .18s ease; }
    .opts-page { background: #272727; border: 1px solid rgba(255,255,255,.12); border-radius: 8px; width: min(820px, 96vw); max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; box-shadow: 0 8px 40px rgba(0,0,0,.5); }
    .opts-page::-webkit-scrollbar { width: 4px; }
    .opts-page::-webkit-scrollbar-thumb { background: rgba(0,210,255,.15); border-radius: 2px; }
    .opts-hdr { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; border-bottom: 1px solid rgba(0,210,255,.1); flex-shrink: 0; }
    .opts-hdr-title { font-family: var(--ff-mono); font-size: 13px; letter-spacing: 3px; color: var(--cyan); text-transform: uppercase; }
    .opts-close { background: none; border: 1px solid rgba(0,210,255,.16); border-radius: var(--r); padding: 5px 14px; color: var(--text-dim); font-family: var(--ff-mono); font-size: 9px; letter-spacing: 2px; cursor: pointer; transition: all .15s; }
    .opts-close:hover { color: var(--cyan); border-color: rgba(0,210,255,.4); background: rgba(0,210,255,.05); }
    .opts-body { padding: 22px 24px; display: flex; flex-direction: column; gap: 24px; }
    .opts-section-hdr { font-family: var(--ff-mono); font-size: 8px; letter-spacing: 3px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid rgba(0,210,255,.06); }
    .opts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .opts-card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09); border-radius: 6px; padding: 18px 20px; cursor: pointer; transition: all .15s; display: flex; flex-direction: column; gap: 8px; }
    .opts-card:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.18); transform: translateY(-1px); }
    .opts-card-icon { font-size: 22px; line-height: 1; }
    .opts-card-title { font-family: var(--ff-ui); font-size: 14px; color: var(--text-b); font-weight: 600; }
    .opts-card-desc { font-family: var(--ff-ui); font-size: 12px; color: var(--text-dim); line-height: 1.5; }
    .idle-opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .idle-btn { background: rgba(0,210,255,.04); border: 1px solid rgba(0,210,255,.15); border-radius: var(--r); padding: 9px 18px; color: var(--text-dim); font-family: var(--ff-ui); font-size: 13px; cursor: pointer; transition: all .15s; }
    .idle-btn:hover { background: rgba(0,210,255,.1); color: var(--text-b); border-color: rgba(0,210,255,.35); }
    .idle-btn.active { background: rgba(0,210,255,.15); color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 12px rgba(0,210,255,.15); }

    .btn-lock-hdr { background: transparent; border: 1px solid rgba(255,43,74,.25); border-radius: var(--r); padding: 5px 10px; color: rgba(255,43,74,.6); font-family: var(--ff-mono); font-size: 8.5px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: all .15s; display: inline-flex; align-items: center; gap: 5px; }
    .btn-lock-hdr:hover { color: var(--red); border-color: var(--red); box-shadow: 0 0 10px rgba(255,43,74,.15); }
    .btn-logout-hdr { background: transparent; border: 1px solid rgba(0,210,255,.15); border-radius: var(--r); padding: 5px 10px; color: var(--text-dim); font-family: var(--ff-mono); font-size: 8.5px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: all .15s; display: inline-flex; align-items: center; gap: 5px; }
    .btn-logout-hdr:hover { color: var(--text); border-color: rgba(0,210,255,.35); }

    /* TOOLBAR */
    .ex-toolbar { background: #202020; border-bottom: 1px solid rgba(255,255,255,.07); padding: 4px 8px; display: flex; align-items: stretch; gap: 1px; flex-shrink: 0; flex-wrap: wrap; }
    .tb-group { display: flex; align-items: stretch; gap: 1px; padding: 0 6px; border-right: 1px solid rgba(255,255,255,.07); }
    .tb-group:last-child { border-right: none; }
    .tb-btn { background: transparent; color: var(--text-dim); border: 1px solid transparent; border-radius: 4px; padding: 4px 8px; font-family: var(--ff-ui); font-size: 12px; font-weight: 400; cursor: pointer; transition: background .1s, border-color .1s, color .1s; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 5px; min-width: 28px; }
    .tb-btn:hover:not(:disabled) { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.12); color: var(--text-b); }
    .tb-btn.accent { color: var(--cyan); }
    .tb-btn.accent:hover { background: rgba(0,120,212,.12); border-color: rgba(0,120,212,.3); }
    .tb-btn.active { background: rgba(0,120,212,.15); color: var(--cyan); border-color: rgba(0,120,212,.3); }
    .tb-btn:disabled { opacity: .55; cursor: not-allowed; }
    /* Encrypt button — subtle green when enabled */
    .tb-btn.tb-enc:not(:disabled) img.ico { filter: brightness(0) invert(.45) sepia(1) saturate(3) hue-rotate(90deg); }
    .tb-btn.tb-enc:not(:disabled):hover img.ico { filter: brightness(0) invert(.7) sepia(1) saturate(3) hue-rotate(90deg); }
    /* Decrypt button — subtle red when enabled */
    .tb-btn.tb-dec:not(:disabled) img.ico { filter: brightness(0) invert(.5) sepia(1) saturate(4) hue-rotate(310deg); }
    .tb-btn.tb-dec:not(:disabled):hover img.ico { filter: brightness(0) invert(.75) sepia(1) saturate(4) hue-rotate(310deg); }
    .tb-btn img.ico { width: 16px; height: 16px; filter: brightness(0) invert(.38) sepia(1) saturate(1.2) hue-rotate(175deg); flex-shrink: 0; display: block; transition: filter .1s; }
    .tb-btn:disabled img.ico { filter: brightness(0) invert(.28); }
    .tb-btn:hover:not(:disabled) img.ico, .tb-btn.accent img.ico, .tb-btn.active img.ico { filter: brightness(0) invert(.75) sepia(1) saturate(2) hue-rotate(175deg); }
    .tb-btn .tb-lbl { font-size: 12px; color: inherit; white-space: nowrap; line-height: 1; }
    .tb-sep { width: 1px; height: 18px; background: rgba(255,255,255,.08); margin: 0 4px; flex-shrink: 0; align-self: center; }

    /* SEARCH */
    .search-wrap { display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 6px; padding: 5px 12px; min-width: 180px; min-height: 34px; box-shadow: none; transition: border-color .15s, background .15s; box-sizing: border-box; }
    .search-wrap:focus-within { border-color: rgba(0,120,212,.6); background: rgba(0,120,212,.06); }
    .search-wrap:focus-within .search-icon { filter: brightness(0) invert(.75); }
    .search-inp { background-color: transparent !important; background: transparent !important; border: none !important; box-shadow: none !important; -webkit-box-shadow: none !important; outline: none !important; padding: 0; margin: 0; appearance: none; -webkit-appearance: none; border-radius: 0 !important; color: var(--text-b); font-family: var(--ff-ui); font-size: 13px; flex: 1; min-width: 0; height: 20px; line-height: 20px; color-scheme: dark; }
    .search-inp::placeholder { color: rgba(255,255,255,.35); }
    .tb-dropdown { position:relative; }
    .tb-drop-menu { position:absolute; top:100%; left:0; min-width:160px; background:#2b2b2b; border:1px solid rgba(255,255,255,.1); border-radius:4px; z-index:500; box-shadow:0 8px 24px rgba(0,0,0,.4); padding:4px 0; }
    .tb-drop-item { display:flex; align-items:center; gap:10px; padding:7px 14px; font-family:var(--ff-ui); font-size:13px; color:var(--text); cursor:pointer; white-space:nowrap; }
    .tb-drop-item:hover { background:rgba(255,255,255,.07); }
    .tb-drop-item .chk { width:14px; text-align:center; color:var(--cyan); font-size:10px; }

    /* ADDRESS BAR */
    .ex-addr-row { background: #1e1e1e; border-bottom: 1px solid rgba(255,255,255,.07); padding: 6px 12px; display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
    .addr-nav-btn { background: transparent; border: none; border-radius: 4px; padding: 6px 7px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .12s; flex-shrink: 0; }
    .addr-nav-btn:hover:not(:disabled) { background: rgba(255,255,255,.08); }
    .addr-nav-btn:active:not(:disabled) { background: rgba(255,255,255,.12); }
    .addr-nav-btn:disabled { opacity: .45; cursor: not-allowed; }
    .addr-nav-btn img, .addr-nav-btn svg { width: 15px; height: 15px; filter: brightness(0) invert(.7); display: block; flex-shrink: 0; }
    .addr-nav-sep { width: 1px; height: 18px; background: rgba(255,255,255,.1); margin: 0 4px; flex-shrink: 0; align-self: center; }
    .addr-pill { flex: 1; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 6px; padding: 5px 14px; display: flex; align-items: center; gap: 0; overflow-x: auto; scrollbar-width: none; white-space: nowrap; min-height: 34px; transition: border-color .15s, background .15s; }
    .addr-pill:hover { border-color: rgba(255,255,255,.2); background: rgba(255,255,255,.07); }
    .addr-pill::-webkit-scrollbar { display: none; }
    .addr-seg { background: transparent; color: rgba(255,255,255,.6); border: none; padding: 2px 8px; border-radius: 4px; font-family: var(--ff-ui); font-size: 13px; cursor: pointer; transition: background .1s, color .1s; white-space: nowrap; }
    .addr-seg:hover { background: rgba(255,255,255,.1); color: var(--text-b); }
    .addr-seg.cur { color: var(--text-b); cursor: default; font-weight: 500; }
    .addr-seg.cur:hover { background: transparent; }
    .addr-arrow { color: rgba(255,255,255,.25); font-size: 14px; padding: 0 1px; user-select: none; flex-shrink: 0; line-height: 1; }

    /* EXPLORER BODY */
    .ex-body-wrap { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
    .ex-body { display: flex; flex: 1; overflow: hidden; }

    /* TREE */
    .tree-pane { width: 220px; min-width: 160px; max-width: 480px; border-right: none; overflow: hidden; display: flex; flex-direction: column; background: #1e1e1e; flex-shrink: 0; user-select: none; }
    .tree-resize-handle {
      width: 4px; flex-shrink: 0; cursor: col-resize;
      background: rgba(255,255,255,.07);
      transition: background .15s;
      position: relative; z-index: 5;
    }
    .tree-resize-handle:hover, .tree-resize-handle.dragging { background: rgba(0,120,212,.7); }
    .tree-pane::-webkit-scrollbar { width: 3px; }
    .tree-pane::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 2px; }
    .tree-scroll { padding: 6px 0; }
    .tree-scroll::-webkit-scrollbar { width: 3px; }
    .tree-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 2px; }
    .tree-logo-wrap { display: flex; flex-direction: column; align-items: center; padding: 18px 0 14px; border-bottom: 1px solid rgba(0,210,255,.08); flex-shrink: 0; }
    .tree-logo-svg-wrap { position: relative; width: 64px; height: 64px; margin-bottom: 10px; }
    .tree-logo-svg-wrap .ring-pulse { position: absolute; border-radius: 50%; border: 1px solid var(--cyan); animation: ringOutSm 2.4s ease-out infinite; }
    .tree-logo-svg-wrap .ring-pulse:nth-child(2) { animation-delay: .8s; }
    @keyframes ringOutSm { 0% { inset: 27px; opacity: .7; } 100% { inset: -12px; opacity: 0; } }
    .tree-logo-name { font-family: var(--ff-mono); font-size: 11px; font-weight: 700; letter-spacing: 3px; color: var(--text-b); }
    .tree-bottom {
      border-top: 1px solid rgba(255,255,255,.07); padding: 10px 12px 12px;
      background: transparent; flex-shrink: 0;
    }
    .tree-btm-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .tree-btm-lbl { font-family: var(--ff-ui); font-size: 12px; font-weight: 400; color: var(--text-dim); }
    .tree-btm-val { font-family: var(--ff-ui); font-size: 12px; color: var(--text-b); font-weight: 500; }
    .tree-btm-acts { display: flex; gap: 6px; margin-top: 10px; }
    .tree-btm-btn { flex: 1; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 4px; padding: 7px 8px; color: var(--text-dim); font-family: var(--ff-ui); font-size: 12px; cursor: pointer; transition: all .15s; text-align: center; }
    .tree-btm-btn:hover { background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.18); color: var(--text-b); }
    .tree-btm-btn.danger { border-color: rgba(231,72,86,.25); color: rgba(231,72,86,.7); flex: 0 0 auto; padding: 7px 12px; }
    .tree-btm-btn.danger:hover { background: rgba(231,72,86,.08); border-color: var(--red); color: var(--red); }
    select { width: 100%; background: rgba(0,210,255,.04); border: 1px solid rgba(0,210,255,.18); border-radius: var(--r); padding: 10px 14px; color: var(--text-b); font-family: var(--ff-ui); font-size: 13px; outline: none; cursor: pointer; }
    .tree-sec-hdr { padding: 8px 14px 4px; font-family: var(--ff-ui); font-size: 11px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; user-select: none; }
    .tree-sec-hdr:hover { color: var(--text-b); }
    .tree-sec-chevron { font-size: 9px; opacity: .45; transition: transform .15s; display: inline-block; margin-left: 4px; }
    .tree-sec-chevron.collapsed { transform: rotate(-90deg); }
    .tree-row { display: flex; align-items: center; gap: 5px; padding: 5px 10px; font-family: var(--ff-ui); font-size: 13px; letter-spacing: 0; color: var(--text-dim); cursor: pointer; white-space: nowrap; overflow: hidden; transition: background .1s, color .1s; border-radius: 2px; }
    .tree-row:hover { background: rgba(255,255,255,.06); color: var(--text-b); }
    .tree-row.active { background: rgba(0,120,212,.2); color: var(--cyan); border-left: 2px solid var(--cyan); padding-left: 8px; }
    .tree-arrow { display:flex; align-items:center; justify-content:center; color: rgba(255,255,255,.3); width: 13px; flex-shrink: 0; transition: transform .14s; }
    .tree-arrow.open { transform: rotate(90deg); }
    .tree-arrow svg { display:block; }
    .tree-lbl { overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .tree-row .tree-folder-icon { filter: brightness(0) invert(.55) sepia(1) saturate(1.5) hue-rotate(175deg); transition: filter .1s; }
    .tree-row:hover .tree-folder-icon, .tree-row.active .tree-folder-icon { filter: brightness(0) invert(.85) sepia(1) saturate(1.5) hue-rotate(175deg); }
    .tree-row .fav-btn { margin-left: auto; opacity: 0; flex-shrink: 0; background: none; border: none; cursor: pointer; padding: 0 3px; line-height: 1; display: flex; align-items: center; }
    .tree-row .fav-btn img { width: 11px; height: 11px; filter: brightness(0) invert(.4) sepia(1) saturate(6) hue-rotate(35deg); }
    .tree-row:hover .fav-btn { opacity: 1; }
    .tree-row .fav-btn.active { opacity: 1; }
    .tree-row .fav-btn.active img { filter: brightness(0) invert(.85) sepia(1) saturate(5) hue-rotate(3deg); }

    /* CONTENT */
    .content-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #202020; position: relative; }
    .content-pane.drag-over::after { content: 'DROP TO STORE'; position: absolute; inset: 6px; border: 1px dashed rgba(255,255,255,.3); border-radius: var(--r); background: rgba(255,255,255,.03); display: flex; align-items: center; justify-content: center; font-family: var(--ff-ui); font-size: 13px; font-weight: 600; letter-spacing: 2px; color: rgba(255,255,255,.5); z-index: 10; pointer-events: none; }
    .dir-row.drag-over { background: rgba(0,120,212,.15) !important; outline: 1px dashed rgba(0,120,212,.5); }
    .file-scroll { flex: 1; overflow-y: auto; }
    .file-scroll::-webkit-scrollbar { width: 5px; }
    .file-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 3px; }

    /* FILE GRID — icon/list/tiles views */
    .file-grid { display:flex; flex-wrap:wrap; gap:4px; padding:10px 14px; align-content:start; }
    .file-grid-item { display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 6px;
      border:1px solid transparent; border-radius:4px; cursor:pointer; user-select:none; min-width:0;
      transition:background .1s,border-color .1s; }
    .file-grid-item:hover { background:rgba(0,210,255,.06); border-color:rgba(0,210,255,.15); }
    .file-grid-item.sel { background:rgba(0,210,255,.1)!important; border-color:var(--cyan)!important; }
    .file-grid-item .gi-name { font-family:var(--ff-ui);font-size:11px;color:var(--text);text-align:center;
      word-break:break-all;line-height:1.3;max-width:100%;overflow:hidden;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical; }
    .vmode-large .file-grid-item { width:90px; }
    .vmode-large .file-grid-item img { width:48px; height:48px; }
    .vmode-small .file-grid-item { width:68px; }
    .vmode-small .file-grid-item img { width:24px; height:24px; }
    .vmode-tiles .file-grid-item { width:200px; flex-direction:row; align-items:center; gap:10px; padding:7px 10px; }
    .vmode-tiles .file-grid-item img { width:28px; height:28px; flex-shrink:0; }
    .vmode-tiles .gi-name { text-align:left; -webkit-line-clamp:1; }
    .vmode-list .file-grid { gap:1px; }
    .vmode-list .file-grid-item { width:100%; flex-direction:row; align-items:center; gap:8px; padding:5px 10px; }
    .vmode-list .file-grid-item img { width:16px; height:16px; flex-shrink:0; }
    .vmode-list .gi-name { text-align:left; -webkit-line-clamp:1; }

    /* FILE TABLE */
    .file-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .file-table th { padding: 8px 12px; background: #252525; text-align: left; font-family: var(--ff-ui); font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: none; letter-spacing: 0; border-bottom: 1px solid rgba(255,255,255,.07); position: sticky; top: 0; z-index: 2; overflow: hidden; white-space: nowrap; user-select: none; }
    .file-table td { padding: 7px 12px; border-bottom: 1px solid rgba(255,255,255,.04); vertical-align: middle; font-family: var(--ff-ui); font-size: 14px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--text); }
    .file-table tbody tr:last-child td { border-bottom: none; }
    .file-table tbody tr:hover { background: rgba(255,255,255,.04); }
    .file-table tbody tr.row-sel td { background: rgba(0,120,212,.18) !important; }
    .file-table tbody tr.row-sel td:first-child { border-left: 2px solid var(--cyan); }
    .fn-cell { display: flex; align-items: center; gap: 9px; }
    .dir-emoji { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; line-height: 1; }
    .dir-emoji img { width: 22px; height: 22px; }
    .ft-img { flex-shrink: 0; }
    .fn-dir  { color: var(--text); cursor: pointer; font-weight: 500; }
    .fn-dir:hover { color: var(--text-b); }
    .fn-name { color: var(--text); }
    .cell-dim { color: var(--text-dim); font-family: var(--ff-ui); font-size: 13px; }
    .cell-acts { display: flex; gap: 3px; transition: opacity .12s; }
    .file-table tbody tr:hover .cell-acts { opacity: 1; }
    .col-chk { display: none; }
    /* Column resize handle */
    .col-resize { position: absolute; right: 0; top: 0; bottom: 0; width: 5px; cursor: col-resize; z-index: 3; }
    .col-resize:hover, .col-resize.dragging { background: rgba(0,120,212,.5); }
    /* Checkboxes hidden — selection via Ctrl/Shift click */
    .file-table th.sortable { cursor: pointer; user-select: none; }
    .file-table th.sortable:hover { color: var(--text-b); }
    .file-table th.sort-asc::after  { content: ' ▲'; font-size: 8px; color: var(--cyan); }
    .file-table th.sort-desc::after { content: ' ▼'; font-size: 8px; color: var(--cyan); }
    .col-status { width: 48px; text-align: center; position: relative; }
    .status-enc  { display:inline-flex;align-items:center;gap:4px;font-size:13px;font-family:var(--ff-ui);color:#6ccb5f; }
    .status-plain{ display:inline-flex;align-items:center;gap:4px;font-size:13px;font-family:var(--ff-ui);color:#e74856; }
    .status-mixed{ display:inline-flex;align-items:center;gap:4px;font-size:13px;font-family:var(--ff-ui);color:#f7c948; }
    .status-enc svg, .status-plain svg, .status-mixed svg { width:15px;height:15px;flex-shrink:0; }

    /* ACTION BUTTONS */
    .act-btn { background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 4px 6px; cursor: pointer; transition: all .12s; display: flex; align-items: center; justify-content: center; }
    .act-btn img.ico { width: 15px; height: 15px; filter: brightness(0) invert(.45); display: block; transition: filter .12s; }
    .act-btn:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.12); }
    .act-btn:hover img.ico { filter: brightness(0) invert(.85); }
    .act-btn.ren:hover { background: rgba(0,120,212,.12); border-color: rgba(0,120,212,.25); }
    .act-btn.dl:hover  { background: rgba(108,203,95,.1); border-color: rgba(108,203,95,.25); }
    .act-btn.dl:hover  img.ico { filter: brightness(0) invert(1) sepia(1) saturate(3) hue-rotate(105deg) brightness(.85); }
    .act-btn.del:hover { background: rgba(231,72,86,.1); border-color: rgba(231,72,86,.25); }
    .act-btn.del img.ico { filter: brightness(0) invert(.55) sepia(1) saturate(6) hue-rotate(310deg); }
    .act-btn.del:hover img.ico { filter: brightness(0) invert(.85) sepia(1) saturate(6) hue-rotate(310deg) brightness(1.1); }

    .empty-pane { padding: 80px 20px; text-align: center; color: var(--text-dim); }
    .empty-pane .ep-ico { font-size: 40px; margin-bottom: 14px; opacity: .2; }
    .empty-pane p { font-family: var(--ff-ui); font-size: 14px; color: var(--text-dim); }
    .empty-pane small { font-family: var(--ff-ui); font-size: 12px; color: var(--text-dim); }

    .status-bar { padding: 4px 14px; font-family: var(--ff-ui); font-size: 12px; letter-spacing: 0; color: var(--text-dim); border-top: 1px solid rgba(255,255,255,.06); background: rgba(0,0,0,.32); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; gap: 18px; flex-shrink: 0; align-items: center; }

    /* OVERLAY */
    .overlay { position: fixed; inset: 0; background: rgba(0,3,8,.93); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; font-family: var(--ff-mono); font-size: 12px; font-weight: 700; text-align: center; padding: 20px; letter-spacing: 3px; text-transform: uppercase; color: var(--cyan); }
    .overlay-sub { color: var(--text-dim); font-size: 9.5px; font-weight: 400; margin-top: 8px; max-width: 340px; letter-spacing: 2px; }

    /* TOAST */
    #toast { position: fixed; bottom: 24px; right: 24px; padding: 11px 18px; border-radius: var(--r); font-family: var(--ff-mono); font-size: 10.5px; letter-spacing: 1px; z-index: 400; max-width: 380px; display: none; animation: fadeUp .25s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    #toast.ok  { background: rgba(0,255,136,.07); border: 1px solid rgba(0,255,136,.28); color: var(--green); }
    #toast.err { background: rgba(255,43,74,.07);  border: 1px solid rgba(255,43,74,.28);  color: var(--red); }
    #toast.inf { background: rgba(0,210,255,.07);  border: 1px solid rgba(0,210,255,.28);  color: var(--cyan); }

    /* MODAL */
    .modal-bg { position: fixed; inset: 0; z-index: 700; background: rgba(0,3,8,.85); display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
    .modal-box { background: rgba(0,8,20,.99); border: 1px solid rgba(0,210,255,.2); border-radius: var(--r); padding: 32px 36px; width: 100%; max-width: 500px; box-shadow: var(--shadow), 0 0 50px rgba(0,210,255,.04); position: relative; overflow: hidden; }
    .modal-box::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--cyan), transparent); opacity: .4; }
    .modal-box h2 { font-family: var(--ff-mono); font-size: 13px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--text-b); margin-bottom: 8px; }
    .modal-sub { font-family: var(--ff-ui); color: var(--text-dim); font-size: 13px; margin-bottom: 20px; line-height: 1.65; letter-spacing: 0; }
    .modal-btns { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
    .modal-scroll { max-height: 240px; overflow-y: auto; background: rgba(0,210,255,.03); border: 1px solid rgba(0,210,255,.1); border-radius: var(--r); padding: 10px 14px; margin-bottom: 12px; font-family: var(--ff-mono); font-size: 11px; letter-spacing: .3px; }
    .ft-img { display:inline-block; vertical-align:middle; flex-shrink:0; }

    @media (max-width: 700px) {
      .tree-pane { display: none; }
      .row2 { grid-template-columns: 1fr; }
      .auth-card { padding: 32px 24px; }
      .sys-block { display: none; }
    }
  </style>
</head>

/* Patch all <img src="icons/..."> → embedded data URI, both existing and future DOM nodes */(function(){
  function _patchIcons(root){
    if(!root || !root.querySelectorAll) return;
    root.querySelectorAll('img[src^="icons/"]').forEach(function(img){
      var k = img.getAttribute('src').replace(/^icons\//,'');
      if(ICONS[k]) img.setAttribute('src', ICONS[k]);
    });
  }
  new MutationObserver(function(muts){
    muts.forEach(function(m){
      m.addedNodes.forEach(function(n){
        if(n.nodeType !== 1) return;
        if(n.tagName === 'IMG'){
          var s = n.getAttribute('src') || '';
          if(s.indexOf('icons/') === 0){
            var k = s.replace(/^icons\//,'');
            if(ICONS[k]) n.setAttribute('src', ICONS[k]);
          }
        }
        _patchIcons(n);
      });
    });
  }).observe(document.documentElement, {childList:true, subtree:true});
  document.addEventListener('DOMContentLoaded', function(){ _patchIcons(document); });
})();

function _lockoutKey()  { return 'nmk_lockout_' + (S.vaultDir?.name || S.opfsVaultName || '_'); }
function _lockoutSave() {
  try { localStorage.setItem(_lockoutKey(), JSON.stringify({fa: S.failedAttempts, lu: S.lockoutUntil})); } catch {}
}
function _lockoutLoad() {
  try {
    const d = JSON.parse(localStorage.getItem(_lockoutKey()) || 'null');
    if (!d) return;
    /* Only restore lockout if it hasn't expired yet */
    S.lockoutUntil   = (d.lu && d.lu > Date.now()) ? d.lu : 0;
    S.failedAttempts = S.lockoutUntil > 0 ? 0 : (d.fa || 0);
  } catch {}
}
function _lockoutClear() {
  S.failedAttempts = 0; S.lockoutUntil = 0;
  try { localStorage.removeItem(_lockoutKey()); } catch {}
}

/* ══════════════════════════════════════════════════════════════════════════
   LOCK COUNTDOWN
   Shows a MM:SS countdown in the sidebar and header until auto-lock fires.
   startCountdown()  — called when the explorer opens / idle timer resets.
   stopCountdown()   — called when the vault is locked or the user logs out.
══════════════════════════════════════════════════════════════════════════ */
let _cdIv = null; /* setInterval handle for the countdown ticker */

/* Start (or restart) the 1-second countdown ticker. */
function startCountdown()
{
    if (_cdIv) { clearInterval(_cdIv); }
    _cdIv = setInterval(_tickCd, 1000);
    _tickCd(); /* immediate first update so the display is correct right away */
}

/* Update every .lock-cd-val element with the remaining MM:SS string. */
function _tickCd()
{
    const rem = Math.max(0, S.lockDeadline - Date.now());
    const m   = Math.floor(rem / 60000);
    const s   = Math.floor((rem % 60000) / 1000);
    const txt = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    document.querySelectorAll('.lock-cd-val').forEach(el => { el.textContent = txt; });
}

/* Stop the countdown ticker and reset all indicators to '--:--'. */
function stopCountdown()
{
    if (_cdIv)
    {
        clearInterval(_cdIv);
        _cdIv = null;
    }
    document.querySelectorAll('.lock-cd-val').forEach(el => { el.textContent = '--:--'; });
}

/**

 * typed "hint" and a hint string exists.

function checkHintMode(value)
{

}

/* ══════════════════════════════════════════════════════════════════════════
   AUTH INPUT  —  Star-masking + animated placeholder scramble
   ──────────────────────────────────────────────────────────────────────
   Security goals:
     1. The real passphrase never appears in inp.value — only ★ symbols.
     2. Clipboard sniffing is blocked: pasted text is masked immediately.
     3. No keylogger can read the value from the DOM.
   The real passphrase is stored in inp._real (an expando property).
══════════════════════════════════════════════════════════════════════════ */

/**
 * Attach secure passphrase input behaviour to the #l-pp element.
 * Must be called after the login form has been injected into the DOM.
 */
function setupAuthInput()
{
    const inp = document.getElementById('l-pp');
    if (!inp) { return; }

    let real = '';   /* The actual passphrase, never stored in inp.value */
    inp._real = '';  /* Expose via expando so actLogin() can read it */

    let animIv = null; /* setInterval handle for the placeholder scramble */

    /* Characters used in the animated placeholder — chosen to look like
       real passwords without suggesting any bias in character distribution */
    const POOL   = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789!@#$%&*';
    const rndStr = n => Array.from({ length: n }, () => POOL[Math.floor(Math.random() * POOL.length)]).join('');

    /* Measure how many characters roughly fill the input width */
    function placeholderLen()
    {
        /* Use a hidden canvas to measure one character's width,
           then divide the input's clientWidth by it */
        const style = getComputedStyle(inp);
        const ctx   = (placeholderLen._cv = placeholderLen._cv || document.createElement('canvas')).getContext('2d');
        ctx.font    = `${style.fontSize} ${style.fontFamily}`;
        const chW   = ctx.measureText('A').width || 8;
        return Math.max(16, Math.floor((inp.clientWidth - 24) / chW));
    }

    /* Start the scrambling animation in the placeholder text. */
    function startAnim()
    {
        if (animIv) { return; } /* Already running */
        animIv = setInterval(() =>
        {
            /* Only update placeholder when field is empty so it doesn't
               flicker while the user is typing */
            if (!real) { inp.placeholder = rndStr(placeholderLen()); }
        }, 900);
    }

    /* Stop the scrambling animation. */
    function stopAnim()
    {
        if (animIv)
        {
            clearInterval(animIv);
            animIv = null;
        }
    }

    /* Show an initial random placeholder before the user starts typing */
    inp.placeholder = rndStr(24); /* 24 is a safe fallback before layout */
    requestAnimationFrame(() => { inp.placeholder = rndStr(placeholderLen()); });

    inp.addEventListener('focus', startAnim);
    inp.addEventListener('blur', () =>
    {
        stopAnim();
        if (!real) { inp.placeholder = rndStr(placeholderLen()); } /* Refresh on blur */
    });

    /*
     * Intercept every keystroke and build 'real' manually.
     * Default action is prevented so no raw character ever appears in the DOM.
     */
    inp.addEventListener('keydown', e =>
    {
        /* Pass through browser shortcuts (Ctrl+C, Ctrl+V, etc.) */
        if (e.ctrlKey || e.metaKey || e.altKey) { return; }

        /* Non-printable keys that should not modify the passphrase */
        const ignore = [
            'Tab','Escape','ArrowLeft','ArrowRight','ArrowUp','ArrowDown',
            'Home','End','PageUp','PageDown','CapsLock','Shift','Control',
            'Alt','Meta',
            'F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12',
            'Enter'
        ];
        if (ignore.includes(e.key)) { return; }

        e.preventDefault(); /* Block default so no raw character appears in the field */

        if (e.key === 'Backspace')
        {
            /* Remove the last character from the real passphrase */
            real = real.slice(0, -1);
        }
        else if (e.key === 'Delete')
        {
            /* Clear the entire passphrase (like Ctrl+A + Delete) */
            real = '';
        }
        else if (e.key.length === 1)
        {
            /* Append a regular printable character */
            real += e.key;
        }

        /* Toggle the scramble animation: stop when typing, restart when empty */
        if (real) { stopAnim(); }
        else      { startAnim(); }

        /* Always show ★ symbols — never the real characters */
        inp.value = '★'.repeat(real.length);
        inp._real = real;
        checkHintMode(real); /* Check if user typed the word "hint" */
    });

    /*
     * Safety net: if any character somehow leaked into the DOM value
     * (e.g. via browser autofill override), mask it immediately.
     */
    inp.addEventListener('input', () =>
    {
        inp.value = '★'.repeat(real.length);
    });

    /* Allow paste but mask the pasted text immediately */
    inp.addEventListener('paste', e =>
    {
        e.preventDefault();
        const txt = (e.clipboardData || window.clipboardData).getData('text');
        real += txt;
        stopAnim();
        inp.value = '★'.repeat(real.length);
        inp._real = real;
    });
}

function createBackground() {
  const bg = document.getElementById('nmk-bg'); if (!bg) return;

  // grid
  const grid = document.createElement('div'); grid.className='bg-grid'; bg.appendChild(grid);

  // nebulae
  const nebulaDefs=[
    {left:'10%',top:'20%',w:'500px',h:'350px',bg:'rgba(0,180,255,.12)'},
    {left:'60%',top:'55%',w:'600px',h:'400px',bg:'rgba(0,80,200,.10)'},
    {left:'75%',top:'5%', w:'400px',h:'300px',bg:'rgba(0,180,140,.08)'},
    {left:'30%',top:'70%',w:'450px',h:'300px',bg:'rgba(80,0,180,.08)'},
  ];
  nebulaDefs.forEach((n,i)=>{
    const el=document.createElement('div'); el.className='bg-nebula';
    el.style.cssText=`left:${n.left};top:${n.top};width:${n.w};height:${n.h};background:${n.bg};--dur:${12+i*4}s;--del:-${i*3}s;`;
    bg.appendChild(el);
  });

  // ambient glow
  const glow = document.createElement('div'); glow.className='bg-glows'; bg.appendChild(glow);

  // ── 3-tier star field with directional drift (space travel feel) ──
  // All stars drift in roughly the same direction (bottom-right) at different speeds.
  // Far=slow+dim, Mid=medium+twinkle, Near=fast+bright+fading
  const travelRad = 148 * Math.PI / 180; // ~bottom-right
  const rnd = () => Math.random();

  // Far stars: 200 tiny, very slow (depth illusion)
  for(let i=0;i<200;i++){
    const s=document.createElement('div'); s.className='bg-star s-far';
    const sz=(0.5+rnd()*.7).toFixed(1);
    const dur=(22+rnd()*28).toFixed(1);
    const del=(-(rnd()*(+dur))).toFixed(1);
    const dist=12+rnd()*30;
    const a=travelRad+(rnd()-.5)*.7;
    const tx=(Math.cos(a)*dist).toFixed(1)+'px', ty=(Math.sin(a)*dist).toFixed(1)+'px';
    const oLo=(0.04+rnd()*.18).toFixed(2), oHi=(0.18+rnd()*.28).toFixed(2);
    s.style.cssText=`left:${rnd()*100}%;top:${rnd()*100}%;width:${sz}px;height:${sz}px;--dur:${dur}s;--del:${del}s;--tx:${tx};--ty:${ty};--op-lo:${oLo};--op-hi:${oHi};`;
    bg.appendChild(s);
  }

  // Mid stars: 80 medium, twinkle while drifting
  for(let i=0;i<80;i++){
    const s=document.createElement('div'); s.className='bg-star s-mid';
    const sz=(0.9+rnd()*1.1).toFixed(1);
    const dur=(10+rnd()*14).toFixed(1);
    const del=(-(rnd()*(+dur))).toFixed(1);
    const dist=40+rnd()*80;
    const a=travelRad+(rnd()-.5)*.9;
    const tx=(Math.cos(a)*dist).toFixed(1)+'px', ty=(Math.sin(a)*dist).toFixed(1)+'px';
    const oLo=(0.12+rnd()*.18).toFixed(2), oHi=(0.45+rnd()*.5).toFixed(2);
    const glow=`0 0 ${(+sz*2).toFixed(1)}px rgba(255,255,255,.45)`;
    s.style.cssText=`left:${rnd()*100}%;top:${rnd()*100}%;width:${sz}px;height:${sz}px;--dur:${dur}s;--del:${del}s;--tx:${tx};--ty:${ty};--op-lo:${oLo};--op-hi:${oHi};box-shadow:${glow};`;
    bg.appendChild(s);
  }

  // Near stars: 25 large, fast, streak past
  for(let i=0;i<25;i++){
    const s=document.createElement('div'); s.className='bg-star s-near';
    const sz=(2+rnd()*2.5).toFixed(1);
    const dur=(5+rnd()*7).toFixed(1);
    const del=(-(rnd()*(+dur))).toFixed(1);
    const dist=90+rnd()*160;
    const a=travelRad+(rnd()-.5)*.5;
    const tx=(Math.cos(a)*dist).toFixed(1)+'px', ty=(Math.sin(a)*dist).toFixed(1)+'px';
    const oHi=(0.6+rnd()*.4).toFixed(2);
    const cols=['rgba(255,255,255,.8)','rgba(180,210,255,.8)','rgba(255,220,180,.75)'];
    const col=cols[Math.floor(rnd()*cols.length)];
    s.style.cssText=`left:${rnd()*100}%;top:${rnd()*100}%;width:${sz}px;height:${sz}px;--dur:${dur}s;--del:${del}s;--tx:${tx};--ty:${ty};--op-lo:0;--op-hi:${oHi};box-shadow:0 0 ${(+sz*3).toFixed(1)}px ${col};`;
    bg.appendChild(s);
  }

  // Shooting stars — head+tail meteors, random across screen
  for(let i=0;i<5;i++){
    const el=document.createElement('div'); el.className='bg-shoot';
    // cluster angles around two meteor-shower directions: ~120° and ~150° with some random scatter
    const baseAngs=[120,150,135,160,45,55]; // degrees

/* ══════════════════════════════════════════════════════════════════════════
   CRYPTO  —  Low-level cryptographic primitives
   ──────────────────────────────────────────────────────────────────────
   Key hierarchy:
     passphrase  — user’s secret string
          ↓ PBKDF2-SHA256 (310 000 iterations, 16-byte random salt)
        KEK  (Key Encryption Key = 256-bit AES-GCM key)
          ↓ stored in .dcconfig encrypted by KEK
        DEK  (Data Encryption Key = 32 random bytes = 256-bit)
          ↓ used to encrypt/decrypt all vault files
   For legacy vaults (no masterKey field in config), KEK = DEK.
   For new vaults, a random 32-byte DEK is generated at setup time,
   encrypted by the KEK, and stored in .dcconfig. This means the user
   can change the passphrase without re-encrypting any files.
══════════════════════════════════════════════════════════════════════════ */

/* Convenience shorthands */
const rnd = n => crypto.getRandomValues(new Uint8Array(n));  /* CSPRNG n bytes */
const hex = b => [...b].map(x => x.toString(16).padStart(2, '0')).join(''); /* bytes → hex */
const enc = s => new TextEncoder().encode(s);   /* string → Uint8Array (UTF-8) */
const dec = ab => new TextDecoder().decode(ab); /* ArrayBuffer → string (UTF-8) */

/**
 * Derive a 256-bit AES-GCM key from a passphrase using PBKDF2-SHA256.
 * @param {string}     pp   User passphrase.
 * @param {Uint8Array} salt Random 16-byte salt (stored at start of .dcconfig).
 * @returns {Promise<CryptoKey>} The derived AES-GCM key.
 */
async function deriveKey(pp, salt)
{
    /* Step 1: import the passphrase as raw keying material */
    const km = await crypto.subtle.importKey('raw', enc(pp), 'PBKDF2', false, ['deriveKey']);

    /* Step 2: derive the actual AES-256-GCM key via PBKDF2 */
    return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: PBKDF2_ITER, hash: 'SHA-256' },
        km,
        { name: 'AES-GCM', length: 256 },
        false,              /* not extractable */
        ['encrypt', 'decrypt']
    );
}

/**
 * AES-GCM encrypt. Prepends the random 12-byte IV to the ciphertext.
 * @param {CryptoKey}    key  AES-GCM key.
 * @param {ArrayBuffer}  data Plaintext bytes.
 * @returns {Promise<Uint8Array>} IV (12 bytes) + ciphertext.
 */
async function gcmEnc(key, data)
{
    const iv = rnd(IV_LEN);
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, data);
    const out = new Uint8Array(IV_LEN + ct.byteLength);
    out.set(iv);
    out.set(new Uint8Array(ct), IV_LEN);
    return out;
}

/**
 * AES-GCM decrypt. Expects IV prepended (first 12 bytes).
 * @param {CryptoKey}    key  AES-GCM key.
 * @param {Uint8Array}   data IV (12 bytes) + ciphertext.
 * @returns {Promise<ArrayBuffer>} Plaintext.
 */
function gcmDec(key, data)
{
    return crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: data.subarray(0, IV_LEN) },
        key,
        data.subarray(IV_LEN)
    );
}

/**
 * Import a raw hex DEK (Data Encryption Key) as a CryptoKey.
 * Used when the config stores a random master key.
 * @param {string} hexStr   Hex-encoded key bytes.
 * @param {number} algoId   COSE algorithm ID to determine key length.
 * @returns {Promise<CryptoKey>}
 */
async function importMasterKey(hexStr, algoId)
{
    const meta  = ALGO_META[algoId] || ALGO_META[COSE_AES256GCM];
    const bytes = new Uint8Array(hexStr.match(/.{2}/g).map(h => parseInt(h, 16)));
    return crypto.subtle.importKey(
        'raw',
        bytes.subarray(0, meta.keyLen / 8), /* use only keyLen bits */
        { name: 'AES-GCM' },
        false,
        ['encrypt', 'decrypt']
    );
}

/**
 * Encode data as a DCR3 v3 vault file.
 * Format: MAGIC(4) + algoId_lo(1) + algoId_hi(1) + IV(ivLen) + AES-GCM-CT + SHA-256(32)
 * @param {number}       algoId  COSE algorithm ID (e.g. COSE_AES256GCM).
 * @param {CryptoKey}    key     AES-GCM key.
 * @param {ArrayBuffer}  plain   Plaintext to encrypt.
 * @returns {Promise<Uint8Array>} Complete DCR3 file bytes.
 */
async function v3EncryptBuf(algoId, key, plain)
{
    const meta = ALGO_META[algoId] || ALGO_META[COSE_AES256GCM];
    const iv   = rnd(meta.ivLen);
    const ct   = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plain);

    /* Build header + ciphertext body */
    const body = new Uint8Array(6 + meta.ivLen + ct.byteLength);
    body.set(MAGIC_V3, 0);              /* bytes 0-3: magic "DCR3" */
    body[4] = algoId & 0xFF;            /* byte 4:    COSE ID low byte */
    body[5] = (algoId >> 8) & 0xFF;     /* byte 5:    COSE ID high byte */
    body.set(iv, 6);                    /* bytes 6..6+ivLen: IV */
    body.set(new Uint8Array(ct), 6 + meta.ivLen); /* remaining: ciphertext */

    /* Append SHA-256 integrity footer */
    const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', body));
    const out  = new Uint8Array(body.byteLength + HASH_LEN);
    out.set(body);
    out.set(hash, body.byteLength);
    return out;
}

/* ══════════════════════════════════════════════════════════════════════════
   CONFIG / PREFS / HINT  —  Vault metadata I/O
   ──────────────────────────────────────────────────────────────────────
   .dcconfig  (encrypted JSON)
       { v:2, masterKey:"<hex DEK>", algo:<coseId>, lastLogin:<ts> }
       Encrypted with the user's KEK (PBKDF2-derived key).
       Layout: SALT(16) + gcmEnc(KEK, JSON)

   .dcprefs   (encrypted JSON, encrypted with session DEK)
       { favourites, recentFiles, idleMinutes, vaultAlgo,
         hiddenFiles, dirIcons }
       Re-saved on every user action that changes prefs.

   .dchint    (plaintext text file — accessible before auth)
       Optional hint string set by the user during setup.
══════════════════════════════════════════════════════════════════════════ */

/** @returns {Promise<boolean>} True if a .dcconfig file exists in dir. */
async function cfgExists(dir)
{
    try
    {
        await dir.getFileHandle(CFG_FILE);
        return true;
    }
    catch
    {
        return false;
    }
}

/**
 * Load and decrypt the vault config file.
 * @returns {Promise<{key, kek, salt, cfg}|null>} Session materials or null on failure.
 */
async function cfgLoad(dir, pp)
{
    try
    {
        const fh  = await dir.getFileHandle(CFG_FILE);
        const buf = new Uint8Array(await (await fh.getFile()).arrayBuffer());
        const salt = buf.slice(0, SALT_LEN);

        /* Derive the Key Encryption Key from the user passphrase + stored salt */
        const kek = await deriveKey(pp, salt);

        /* Decrypt config JSON */
        const raw = await gcmDec(kek, buf.subarray(SALT_LEN));
        const cfg = JSON.parse(dec(raw));

        /*
         * If config contains a masterKey (DEK), import it as the session file key.
         * Otherwise the KEK itself is used directly for files (legacy vault).
         */
        const key = cfg.masterKey
            ? await importMasterKey(cfg.masterKey, cfg.algo || COSE_AES256GCM)
            : kek;

        return { key, kek, salt, cfg };
    }
    catch
    {
        return null; /* Wrong passphrase or corrupt config */
    }
}

/**
 * Save the config re-using the existing KEK + salt (no passphrase change).
 * Used for legacy vaults where KEK = file key to avoid breaking file access.
 */
async function cfgSaveInPlace(dir, kek, salt, cfg)
{
    const blob = await gcmEnc(kek, enc(JSON.stringify(cfg)));
    const out  = new Uint8Array(SALT_LEN + blob.byteLength);
    out.set(salt);
    out.set(blob, SALT_LEN);
    const fh = await dir.getFileHandle(CFG_FILE, { create: true });
    const w  = await fh.createWritable();
    await w.write(out);
    await w.close();
}

/**
 * Save the config with a freshly derived KEK (i.e. after a passphrase change
 * or on first-time setup). Generates a new random salt.
 * @returns {Promise<CryptoKey>} The session file key (DEK or KEK for legacy).
 */
async function cfgSave(dir, pp, cfg)
{
    const salt = rnd(SALT_LEN);
    const kek  = await deriveKey(pp, salt); /* new KEK from new salt */
    const blob = await gcmEnc(kek, enc(JSON.stringify(cfg)));
    const out  = new Uint8Array(SALT_LEN + blob.byteLength);
    out.set(salt);
    out.set(blob, SALT_LEN);
    const fh = await dir.getFileHandle(CFG_FILE, { create: true });
    const w  = await fh.createWritable();
    await w.write(out);
    await w.close();

    /* Return the file key: imported DEK (if config has one) or KEK for legacy */
    return cfg.masterKey
        ? await importMasterKey(cfg.masterKey, cfg.algo || COSE_AES256GCM)
        : kek;
}

/**
 * Load user preferences from .dcprefs.
 * @returns {Promise<object>} Prefs object (empty defaults if missing/corrupt).

async function prefsLoad(dir, key)
{
    try
    {
        const fh  = await dir.getFileHandle(PREFS_FILE);
        const buf = new Uint8Array(await (await fh.getFile()).arrayBuffer());
        return JSON.parse(dec(await gcmDec(key, buf)));
    }
    catch
    {
        /* Return safe defaults when prefs are missing or cannot be decrypted */
        return { favourites: [], recentFiles: [] };
    }
}

/** Save user preferences to .dcprefs (encrypted with session key). */
async function prefsSave(dir, key, prefs)
{
    try
    {
        const blob = await gcmEnc(key, enc(JSON.stringify(prefs)));
        const fh   = await dir.getFileHandle(PREFS_FILE, { create: true });
        const w    = await fh.createWritable();
        await w.write(blob);
        await w.close();
    }
    catch { /* silently ignore — prefs are non-critical */ }
}

/** Return the localStorage key for this vault's stats. */
function statsKey()
{
    return 'nmk_stats_' + (S.vaultDir?.name || S.opfsVaultName || 'vault');
}

/**
 * Load persisted stats from localStorage into S.stats.
 * Silently ignored if no data exists or JSON is malformed.
 */
function statsLoad()
{
    try
    {
        const raw = localStorage.getItem(statsKey());
        if (!raw) { return; }
        const d = JSON.parse(raw);
        S.stats.encOk   = d.encOk   || 0;
        S.stats.encFail = d.encFail || 0;
        S.stats.decOk   = d.decOk   || 0;
        S.stats.decFail = d.decFail || 0;
        S.stats.history = Array.isArray(d.history) ? d.history : [];
    }
    catch (e) { /* Ignore malformed or missing data */ }
}

/** Persist S.stats to localStorage. Silently swallows storage errors. */
function statsSave()
{
    try { localStorage.setItem(statsKey(), JSON.stringify(S.stats)); }
    catch (e) { /* Private browsing or quota exceeded */ }
}

/**
 * Record a single encrypt or decrypt event.
 * Appends to the 90-day rolling history and persists immediately.
 * @param {'enc'|'dec'} type  Operation type.
 * @param {boolean}     ok    True if the operation succeeded.
 */
function statsRecord(type, ok)
{
    if (type === 'enc') { if (ok) { S.stats.encOk++; } else { S.stats.encFail++; } }
    else                { if (ok) { S.stats.decOk++; } else { S.stats.decFail++; } }

    S.stats.history.push({ ts: Date.now(), type, ok });

    /* Keep only the last 90 days to avoid unbounded growth */
    const cutoff = Date.now() - 90 * 24 * 3600 * 1000;
    S.stats.history = S.stats.history.filter(e => e.ts >= cutoff);
    statsSave();
}
