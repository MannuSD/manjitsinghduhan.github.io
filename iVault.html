/**
 * Return true if the byte array starts with the DCR3 magic header.
 * Requires at least 6 bytes (4-byte magic + 2-byte algo ID).
 * @param {Uint8Array} b  Buffer to test.
 */
function hasMagicV3(b)
{
    return b.length >= 6
        && b[0] === 0x44  /* 'D' */
        && b[1] === 0x43  /* 'C' */
        && b[2] === 0x52  /* 'R' */
        && b[3] === 0x33; /* '3' */
}
/**
 * List all files and directories in a vault directory.
 * System files are excluded. Directories always sort first.
 * Files are sorted per S.sortBy / S.sortDir.
 * Each entry: { name, handle, kind, encrypted, encSize, plainSize, modified }
 * @param {FileSystemDirectoryHandle} dir  Directory to list.
 * @returns {Promise<Array>}
 */
async function vaultList(dir)
{
    const dirs  = [];
    const files = [];

    for await (const [name, handle] of dir.entries())
    {
        if (SYS_FILES.has(name)) { continue; } /* Skip system files */

        if (handle.kind === 'directory')
        {
            dirs.push({ name, handle, kind: 'dir' });
        }
        else
        {
            try
            {
                const f    = await handle.getFile();
                const head = new Uint8Array(await f.slice(0, 8).arrayBuffer());

                if (hasMagicV3(head))
                {
                    /* Encrypted DCR3 file: derive plain size from header */
                    const aid      = head[4] | (head[5] << 8);
                    const am       = ALGO_META[aid] || ALGO_META[COSE_AES256GCM];
                    const over     = 6 + am.ivLen + 16 + HASH_LEN;
                    const plainSize = Math.max(0, f.size - over);
                    files.push({ name, handle, kind: 'file', encrypted: true,
                                 encSize: f.size, plainSize, modified: f.lastModified });
                }
                else
                {
                    /* Plain file */
                    files.push({ name, handle, kind: 'file', encrypted: false,
                                 encSize: f.size, plainSize: f.size, modified: f.lastModified });
                }
            }
            catch { /* Skip unreadable files */ }
        }
    }

    /* Recursively scan each subdirectory in parallel to determine its encryption status. */
    /* Uses a recursive helper so deeply-nested plain/encrypted files are counted too.    */
    async function scanDirStatus(dirHandle)
    {
        let encCount = 0, plainCount = 0;
        try
        {
            for await (const [cname, ch] of dirHandle.entries())
            {
                if (SYS_FILES.has(cname)) { continue; }
                if (ch.kind === 'directory')
                {
                    const sub = await scanDirStatus(ch);
                    encCount   += sub.encCount;
                    plainCount += sub.plainCount;
                }
                else
                {
                    try
                    {
                        const cf = await ch.getFile();
                        const hd = new Uint8Array(await cf.slice(0, 8).arrayBuffer());
                        if (hasMagicV3(hd)) { encCount++; }
                        else                { plainCount++; }
                    }
                    catch { /* skip unreadable file */ }
                }
            }
        }
        catch { /* skip unreadable directory */ }
        return { encCount, plainCount };
    }

    await Promise.all(dirs.map(async d =>
    {
        const { encCount, plainCount } = await scanDirStatus(d.handle);
        if      (encCount === 0 && plainCount === 0) { d.dirStatus = 'empty'; }
        else if (plainCount === 0)                   { d.dirStatus = 'enc'; }
        else if (encCount === 0)                     { d.dirStatus = 'plain'; }
        else                                         { d.dirStatus = 'mixed'; }
    }));

    /* Directories always sort alphabetically, independent of sortBy */
    dirs.sort((a, b) => a.name.localeCompare(b.name));

    /* Files sort by the active column */
    const cmp = (a, b) =>
    {
        if (S.sortBy === 'size') { return (a.plainSize || 0) - (b.plainSize || 0); }
        if (S.sortBy === 'date') { return (a.modified  || 0) - (b.modified  || 0); }
        return a.name.localeCompare(b.name);
    };
    const d = (S.sortDir === 'desc') ? -1 : 1;
    files.sort((a, b) => d * cmp(a, b));

    return [...dirs, ...files];
}

/**
 * Encrypt a File object and store it in the vault directory.
 * Uses the current vault algorithm (S.vaultAlgo).
 * @param {FileSystemDirectoryHandle} dir  Destination directory.
 * @param {CryptoKey}                 key  Session encryption key.
 * @param {File}                      file Source file to encrypt.
 */
async function vaultWrite(dir, key, file)
{
    const algoId = S.vaultAlgo || COSE_AES256GCM;
    const buf    = await file.arrayBuffer();
    const out    = await v3EncryptBuf(algoId, key, buf);
    const fh     = await dir.getFileHandle(file.name, { create: true });
    const w      = await fh.createWritable();
    await w.write(out);
    await w.close();
}

/**
 * Encrypt raw bytes and store them under a given filename in the vault directory.
 * Used for system files (.dcprefs, .dcnote, etc.).
 * @param {FileSystemDirectoryHandle} dir   Destination directory.
 * @param {CryptoKey}                 key   Session encryption key.
 * @param {string}                    name  Filename to write.
 * @param {ArrayBuffer|Uint8Array}    data  Raw bytes to encrypt.
 */
async function vaultWriteRaw(dir, key, name, data)
{
    const algoId = S.vaultAlgo || COSE_AES256GCM;
    const out    = await v3EncryptBuf(algoId, key, data);
    const fh     = await dir.getFileHandle(name, { create: true });
    const w      = await fh.createWritable();
    await w.write(out);
    await w.close();
}

/**
 * Read and decrypt a DCR3 vault file entry.
 * Validates the magic header, algorithm ID, file length, and SHA-256 integrity.
 * Throws a descriptive Error if any check fails.
 * @param {{ handle: FileSystemFileHandle }} entry  Vault file entry.
 * @param {CryptoKey}                        key    Session decryption key.
 * @returns {Promise<ArrayBuffer>}  Decrypted plaintext.
 */
async function vaultRead(entry, key)
{
    const buf = new Uint8Array(await (await entry.handle.getFile()).arrayBuffer());

    if (!hasMagicV3(buf))
    {
        throw new Error('Not a v3 vault file — only DCR3 format is supported.');
    }

    const algoId = buf[4] | (buf[5] << 8);
    const meta   = ALGO_META[algoId];
    if (!meta) { throw new Error('Unknown COSE algorithm ID ' + algoId); }

    const hLen = 6 + meta.ivLen;
    if (buf.length < hLen + HASH_LEN + 16)
    {
        throw new Error('File too short — may be corrupted');
    }

    /* Verify SHA-256 integrity footer */
    const body   = buf.subarray(0, buf.length - HASH_LEN);
    const stored = buf.subarray(buf.length - HASH_LEN);
    const actual = new Uint8Array(await crypto.subtle.digest('SHA-256', body));
    for (let i = 0; i < HASH_LEN; i++)
    {
        if (stored[i] !== actual[i])
        {
            throw new Error('⚠ Integrity check FAILED — file may be tampered');
        }
    }

    /* Decrypt ciphertext (header + IV already stripped, auth tag included in cipher range) */
    return crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: buf.subarray(6, hLen) },
        key,
        buf.subarray(hLen, buf.length - HASH_LEN)
    );
}

/**
 * Read and decrypt a system file by name from the vault directory.
 * Returns null if the file does not exist, is not DCR3, or decryption fails.
 * @param {FileSystemDirectoryHandle} dir   Vault root or sub-directory.
 * @param {CryptoKey}                 key   Session decryption key.
 * @param {string}                    name  System filename (e.g. NOTE_FILE).
 * @returns {Promise<ArrayBuffer|null>}
 */
async function vaultReadRaw(dir, key, name)
{
    try
    {
        const fh  = await dir.getFileHandle(name);
        const buf = new Uint8Array(await (await fh.getFile()).arrayBuffer());

        if (!hasMagicV3(buf)) { return null; }

        const algoId = buf[4] | (buf[5] << 8);
        const meta   = ALGO_META[algoId];
        if (!meta) { return null; }

        const hLen = 6 + meta.ivLen;
        if (buf.length < hLen + HASH_LEN + 16) { return null; }

        /* Verify integrity */
        const body   = buf.subarray(0, buf.length - HASH_LEN);
        const stored = buf.subarray(buf.length - HASH_LEN);
        const actual = new Uint8Array(await crypto.subtle.digest('SHA-256', body));
        for (let i = 0; i < HASH_LEN; i++)
        {
            if (stored[i] !== actual[i]) { return null; }
        }

        return crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: buf.subarray(6, hLen) },
            key,
            buf.subarray(hLen, buf.length - HASH_LEN)
        );
    }
    catch { return null; } /* File not found or decryption error */
}

/**
 * Format a byte count into a human-readable string (B / KB / MB / GB).
 * @param {number} n  Byte count.
 */
function fmtBytes(n)
{
    if (!n || n <= 0)    { return ''; }
    if (n < 1024)       { return n + ' B'; }
    if (n < 1048576)    { return (n / 1024).toFixed(1) + ' KB'; }
    if (n < 1073741824) { return (n / 1048576).toFixed(2) + ' MB'; }
    return (n / 1073741824).toFixed(2) + ' GB';
}

/**
 * Format a Unix timestamp as a locale date + short time string.
 * @param {number} ts  Unix milliseconds.
 */
function fmtDate(ts)
{
    const d = new Date(ts);
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const yyyy = d.getFullYear();
    const timeStr = d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:true}).toUpperCase();
    return `${dd}-${mm}-${yyyy} ${timeStr}`;
}

/**
 * Format a Unix timestamp as a relative time string (e.g. "5m ago").
 * @param {number} ts  Unix milliseconds.
 */
function fmtRelTime(ts)
{
    const d = Date.now() - ts;
    if (d < 60000)    { return 'just now'; }
    if (d < 3600000)  { return Math.floor(d / 60000)   + 'm ago'; }
    if (d < 86400000) { return Math.floor(d / 3600000) + 'h ago'; }
    return Math.floor(d / 86400000) + 'd ago';
}

/**

 * @param {string}  name   Filename (extension determines icon).
 * @param {boolean} large  True to use the large (44px) size; default is 22px.
 */
function fileTypeImg(name, large = false)
{
    const ext = (name.split('.').pop() || '').toLowerCase();
    const ico = FT_ICONS[ext] || null;
    const src = ico ? `icons/filetypes/${ico}.svg` : 'icons/filetypes/file.svg';
    const sz  = large ? '44px' : '22px';

 * @param {string} name  Filename.
 */
function fileTypeImgSrc(name)
{

/**
 * HTML-escape a string to prevent XSS when inserting into innerHTML.
 * Escapes &, <, >, ", and '.
 * @param {*} s  Value to escape (coerced to string).
 */
function esc(s)
{
    return String(s ?? '')
        .replace(/&/g,  '&amp;')
        .replace(/</g,  '&lt;')
        .replace(/>/g,  '&gt;')
        .replace(/"/g,  '&quot;')
        .replace(/'/g,  '&#x27;');
}

/**
 * Trigger a browser download of an ArrayBuffer under the given filename.
 * A temporary blob URL is created and revoked after 6 seconds.
 * @param {ArrayBuffer|Uint8Array} buf   Data to download.
 * @param {string}                 name  Download filename.
 */
function dlBlob(buf, name)
{
    const url = URL.createObjectURL(new Blob([buf]));
    const a   = document.createElement('a');
    a.href     = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 6000);
}

/** Active toast timeout handle. */
let _tt;

/**
 * Show a transient toast notification.
 * @param {string} msg   Message text.
 * @param {string} type  CSS class: 'inf' | 'ok' | 'err' | 'warn'.
 * @param {number} ms    Milliseconds to show (default 3800).
 */
function toast(msg, type = 'inf', ms = 3800)
{
    const el = document.getElementById('toast');
    el.textContent    = msg;
    el.className      = type;
    el.style.display  = 'block';
    if (_tt) { clearTimeout(_tt); }
    _tt = setTimeout(() => { el.style.display = 'none'; }, ms);
}

function ppStrength(pp){
  if(!pp)return{score:0,label:'',color:'',pct:0};
  let s=0;
  if(pp.length>=12)s++;if(pp.length>=16)s++;if(pp.length>=20)s++;
  if(/[A-Z]/.test(pp))s++;if(/[a-z]/.test(pp))s++;if(/[0-9]/.test(pp))s++;if(/[^A-Za-z0-9]/.test(pp))s++;
  const labels=['','Very Weak','Weak','Fair','Good','Strong','Strong','Very Strong'];
  const colors=['','#ff2b4a','#ff2b4a','#ffd040','#00d2ff','#00ff88','#00ff88','#00ff88'];
  const v=Math.min(s,7); return{score:v,label:labels[v],color:colors[v],pct:Math.round((v/7)*100)};
}
function attachStrengthMeter(iid,wid,lid){

  inp.addEventListener('input',()=>{const{pct,label,color}=ppStrength(inp.value);const w=document.getElementById(wid);const l=document.getElementById(lid);if(w){const b=w.querySelector('.strength-bar');b.style.width=pct+'%';b.style.background=color;}if(l){l.textContent=label;l.style.color=color;}});
}

/* ══════════════════════════════════════════════════════
   IDLE AUTO-LOCK
   After a period with no user interaction, the vault auto-locks.
   mousemove is intentionally excluded to save CPU on large displays.
══════════════════════════════════════════════════════ */

/** Reset (or start) the idle timeout countdown. Called on every user activity event. */
function resetIdleTimer()
{
    if (S.idleTimer) { clearTimeout(S.idleTimer); }
    if (S.view !== 'explorer') { return; } /* Only enforce auto-lock inside the explorer */

    const ms       = S.idleMinutes * 60 * 1000;
    S.lockDeadline = Date.now() + ms;
    S.idleTimer    = setTimeout(() =>
    {
        toast('Auto-locked due to inactivity.', 'inf', 5000);
        actLock();
    }, ms);
    _tickCd(); /* Immediately sync the countdown display */
}

/* User interaction events that reset the idle timer */
const _IEV = ['click', 'keydown', 'touchstart'];

/** Start watching for user activity and begin the countdown display. */
function startIdleTimer()
{
    _IEV.forEach(ev => document.addEventListener(ev, resetIdleTimer, { passive: true }));
    resetIdleTimer();
    startCountdown();
}

/** Stop watching for activity and clear the countdown. */
function stopIdleTimer()
{
    if (S.idleTimer)
    {
        clearTimeout(S.idleTimer);
        S.idleTimer = null;
    }
    _IEV.forEach(ev => document.removeEventListener(ev, resetIdleTimer));
    stopCountdown();
}
/* ══════════════════════════════════════════════════════
   HUD TELEMETRY
   The top chrome bar shows simulated security metrics that update every
   2.2 seconds. Values are randomised on login and drift gradually to
   simulate a live operations dashboard. These are purely cosmetic.
══════════════════════════════════════════════════════ */

/* HUD state: each metric has a 'base' value that drifts over time */
const _hud =
{
    msgs:    { base: 0, drift: 0 },
    servers: { base: 0 },
    agOn:    { base: 0, drift: 0 },
    agOff:   { base: 0, drift: 0 },
    vuln:    { base: 0, drift: 0 },
    traf:    { base: 0, drift: 0 },
};

/** Randomise initial HUD values on login. */
function _hudInit()
{
    _hud.msgs.base    = 12000 + Math.floor(Math.random() * 3000);
    _hud.servers.base = 4     + Math.floor(Math.random() * 4);
    _hud.agOn.base    = 6     + Math.floor(Math.random() * 6);
    _hud.agOff.base   = 1     + Math.floor(Math.random() * 3);
    _hud.vuln.base    = Math.floor(Math.random() * 5);
    _hud.traf.base    = 80    + Math.floor(Math.random() * 400);
}

/** Tick: drift values and update the HUD HTML. */
function _hudTick()
{
    if (S.view !== 'explorer') { return; } /* No-op if we've navigated away */

    /* Gradually drift metrics to look like live data */
    _hud.msgs.base  = _hud.msgs.base + Math.floor(Math.random() * 7);
    _hud.agOn.base  = Math.max(1,  _hud.agOn.base  + (Math.random() > .8 ? (Math.random() > .5 ? 1 : -1) : 0));
    _hud.vuln.base  = Math.max(0,  _hud.vuln.base  + (Math.random() > .9 ? (Math.random() > .4 ? 1 : -1) : 0));
    _hud.traf.base  = Math.max(10, _hud.traf.base  + Math.floor(Math.random() * 60) - 30);

    /* Update only the dynamic text — never touch the logo DOM so animations run continuously */
    const clkEl = document.getElementById('hud-clock');
    const datEl = document.getElementById('hud-date');
    const now = new Date();
    if (clkEl) clkEl.textContent = now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true}).toUpperCase();
    if (datEl) datEl.textContent = now.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
}

let _hudIv = null; /* setInterval handle for HUD refresh */

/** Start the HUD refresh interval. */
function startHUD()
{
    _hudInit();
    if (_hudIv) { clearInterval(_hudIv); }
    _hudIv = setInterval(_hudTick, 1000);
    _hudTick(); /* Immediate first render */
}

/** Stop the HUD refresh interval. */
function stopHUD()
{
    if (_hudIv)
    {
        clearInterval(_hudIv);
        _hudIv = null;
    }
}

/** Format a large number as e.g. "12.3k". */
function fmtHudNum(n)
{
    if (n >= 1000)
    {
        return Math.floor(n / 1000) + '.' + (Math.floor(n / 100) % 10) + 'k';
    }
    return String(n);
}

/* ══════════════════════════════════════════════════════
   RECENT FILES

/**
 * Add a file to the recent-files list (deduplicated, capped at MAX_RECENT).
 * Saves prefs immediately.
 * @param {string} pk    Path key of the directory containing the file.
 * @param {string} name  Filename.
 */
function addRecent(pk, name)
{
    /* Remove any existing entry for the same file (to avoid duplicates) */
    S.recentFiles = S.recentFiles.filter(r => !(r.pathKey === pk && r.name === name));
    S.recentFiles.unshift({ pathKey: pk, name, ts: Date.now() });

    /* Trim list to the configured maximum */
    if (S.recentFiles.length > MAX_RECENT) { S.recentFiles.length = MAX_RECENT; }
    savePrefs();
    /* Refresh tree pane without a full render */
    const ts = document.querySelector('#tree-pane .tree-scroll');
    if (ts) ts.innerHTML = buildTreeHTML();
}

/**
 * Recursively sum the byte sizes of every file in the vault directory tree.
 * System files are excluded. Returns 0 if the directory is unreadable.
 * @param {FileSystemDirectoryHandle} dir
 * @returns {Promise<number>}  Total size in bytes.
 */
async function computeVaultSize(dir)
{
    let total = 0;
    try
    {
        for await (const [name, handle] of dir.entries())
        {
            if (SYS_FILES.has(name)) { continue; }

            if (handle.kind === 'directory')
            {
                total += await computeVaultSize(handle); /* Recurse */
            }
            else
            {
                try { const f = await handle.getFile(); total += f.size; }
                catch { /* Skip unreadable file */ }
            }
        }
    }
    catch { /* Unreadable directory */ }
    return total;
}

/* ══════════════════════════════════════════════════════
   TREE
══════════════════════════════════════════════════════ */

/**
 * Compute the path key for a directory from its breadcrumb trail.
 * The path key is a '/'-joined string of directory names below the vault root.
 * The vault root itself has path key '' (empty string).
 * @param {Array}                      bc   Breadcrumb array.
 * @param {FileSystemDirectoryHandle}  dir  Current directory handle.
 * @returns {string}
 */
function computePathKey(bc, dir)
{
    if (bc.length === 0) { return ''; }
    return [...bc.slice(1).map(b => b.name), dir.name].join('/');
}

/**
 * Initialise the tree state and load the vault root directory.
 * Called once after login.
 */
async function treeInit()
{
    S.treeNodes    = {};
    S.treeHandles  = { '': S.vaultDir };
    S.treeExpanded = new Set(['']); /* Start with root expanded */
    await treeLoad('', S.vaultDir);
}
async function treeLoad(key,dh){
  if(S.treeNodes[key]!==undefined)return;
  S.treeHandles[key]=dh;const ch=[];
  for await(const[name,handle]of dh.entries()){if(handle.kind==='directory'&&!name.startsWith('.')){ch.push({name,handle});const ck=key===''?name:key+'/'+name;S.treeHandles[ck]=handle;}}
  ch.sort((a,b)=>a.name.localeCompare(b.name));S.treeNodes[key]=ch;
}
function renderTreeNodes(nodes,pk,depth){
  if(!nodes||nodes.length===0)return'';
  const cpk=computePathKey(S.breadcrumb,S.currentDir);
  return nodes.map(node=>{
    const key=pk===''?node.name:pk+'/'+node.name;
    const exp=S.treeExpanded.has(key),isA=cpk===key;
    const loaded=S.treeNodes[key]!==undefined,subs=S.treeNodes[key]||[];
    const showA=!loaded||subs.length>0,pl=8+depth*16;
    const isFav=S.favourites.some(f=>f.key===key);
    return`<div class="tree-row${isA?' active':''}" style="padding-left:${pl}px" data-tree-nav="${esc(key)}">
      <span class="tree-arrow${exp?' open':''}" style="${showA?'':'visibility:hidden'}" data-tree-tog="${esc(key)}"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
      <img src="icons/folder.svg" class="tree-folder-icon" style="width:14px;height:14px;flex-shrink:0"><span class="tree-lbl">${esc(node.name)}</span>
      <button class="fav-btn${isFav?' active':''}" data-fav-key="${esc(key)}" data-fav-name="${esc(node.name)}" title="Favourite">
        <img src="icons/star.svg" style="width:11px;height:11px">
      </button>
    </div>${exp?renderTreeNodes(subs,key,depth+1):''}`;
  }).join('');
}

  const recHTML=S.recentFiles.length>0?`<div class="tree-sec-hdr" data-tree-sec="recent"><span style="flex:1">&#128337; Recent</span><button class="tree-sec-clear" data-clear-recent title="Clear recent" style="background:none;border:none;cursor:pointer;padding:1px 4px;font-size:10px;color:var(--text-dim);opacity:.55;line-height:1;border-radius:3px" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.55">&#10005;</button><span class="tree-sec-chevron${recCollapsed?' collapsed':''}">&#9660;</span></div>${recCollapsed?'':S.recentFiles.slice(0,5).map((r,i)=>`<div class="tree-row" data-recent-i="${i}" style="padding-left:12px" title="${esc(r.name)}"><span style="width:13px;flex-shrink:0"></span>${fileTypeImg(r.name)}<span class="tree-lbl" style="font-size:11px">${esc(r.name)}</span><span style="font-size:9px;color:var(--text-dim);flex-shrink:0;margin-left:2px">${fmtRelTime(r.ts)}</span></div>`).join('')}`:'';

/**
 * Add the four corner decorations and scan-line overlay to the document body.
 * Replaces any existing decorations to avoid duplicates.
 */
function addScreenDecorations()
{
    removeScreenDecorations();
    ['tl', 'tr', 'bl', 'br'].forEach(c =>
    {
        const el   = document.createElement('div');
        el.className = `sc-corner ${c}`;
        el.id        = `sc-${c}`;
        const bolt   = document.createElement('div');
        bolt.className = 'bolt';
        el.appendChild(bolt);
        document.body.appendChild(el);
    });
    const sl = document.createElement('div');
    sl.className = 'scan-line';
    sl.id        = 'sc-sl';
    document.body.appendChild(sl);
}

/** Remove all screen corner decorations and the scan-line from the DOM. */
function removeScreenDecorations()
{
    ['sc-tl', 'sc-tr', 'sc-bl', 'sc-br', 'sc-sl'].forEach(id =>
    {
        document.getElementById(id)?.remove();
    });
}

/**
 * Main render dispatcher.
 * Reads S.view and delegates to the appropriate screen renderer.
 * All state mutations should happen before calling render().
 */
function render()
{
    const app = document.getElementById('app');
    switch (S.view)
    {
        case 'start':    renderStart(app);    break;
        case 'login':    renderLogin(app);    break;
        case 'setup':    renderSetup(app);    break;
        case 'explorer': renderExplorer(app); break;
    }
}

    <div class="card-corner tl"></div><div class="card-corner tr"></div><div class="card-corner bl"></div><div class="card-corner br"></div>
    <div class="card-dot tl"></div><div class="card-dot tr"></div><div class="card-dot bl"></div><div class="card-dot br"></div>
    <div class="nmk-logo-wrap">
      <div class="nmk-svg-wrap"><div class="ring-pulse"></div><div class="ring-pulse"></div>${nmkLogoSVG(80)}</div>
      <div class="corp-name">NimKu Vault</div>
      <div class="corp-tagline">CLEARANCE REQUIRED</div>
    </div>
    <div class="auth-divider"><span class="auth-div-txt" style="display:flex;align-items:center;gap:8px"><span class="dot-blink ${locked?'red':'green'}" style="width:7px;height:7px;flex-shrink:0"></span><span style="font-family:var(--ff-mono);font-size:11px;letter-spacing:.5px;color:var(--cyan)">${esc(S.vaultDir?.name)}</span></span></div>
    ${S.lastLogin?`<div style="text-align:center;font-size:11px;color:var(--text-dim);margin-bottom:14px;font-family:var(--ff-ui)">Last login: <span style="color:var(--text)">${new Date(S.lastLogin).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</span></div>`:''}
    ${locked?`<div class="lockout-box">ACCESS SUSPENDED<span class="lockout-cd" id="lock-countdown">${Math.ceil((S.lockoutUntil-Date.now())/1000)}</span>SECONDS REMAINING</div>`:''}
    ${S.failedAttempts>0&&!locked?`<div class="attempt-block">
      <div class="attempt-block-lbl"><span class="dot-blink red" style="width:5px;height:5px;display:inline-block;margin-right:6px"></span>AUTHENTICATION FAILED &nbsp;·&nbsp; ${rem} ATTEMPT${rem!==1?'S':''} REMAINING</div>
      <div class="attempt-pips">${Array.from({length:MAX_ATTEMPTS},(_,i)=>`<div class="attempt-pip${i<S.failedAttempts?' used':''}"></div>`).join('')}</div>
    </div>`:''}
    <div class="hint-reveal" id="hint-reveal" style="${S.hint?'':'display:none!important'}">
      <div class="hint-reveal-lbl">MEMORY ASSIST DECRYPTED</div>${esc(S.hint||'')}
    </div>
    <form id="f-login" autocomplete="off" spellcheck="false">
      <div class="auth-inp-wrap">
        <input type="text" id="l-pp" class="auth-inp" style="padding-left:16px" placeholder="" autofocus autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off" />
      </div>
      ${S.errMsg?`<div class="err-box">${esc(S.errMsg)}</div>`:''}
      <button type="submit" class="auth-btn" ${S.loading||locked?'disabled':''}>
        <span>${S.loading?'<span class="spin" style="border-top-color:#00d2ff"></span>VERIFYING…':'AUTHENTICATE'}</span>
      </button>
    </form>
    <div style="margin-top:12px;text-align:center"><button class="btn-g sm" id="b-chg">← CHANGE VAULT</button></div>
  </div></div>`;
  document.getElementById('f-login').onsubmit=actLogin;
  document.getElementById('b-chg').onclick=actOpenAny;
  setupAuthInput();
  if(locked){
    const tick=()=>{const el=document.getElementById('lock-countdown');if(!el)return;const s=Math.ceil((S.lockoutUntil-Date.now())/1000);if(s<=0){S.lockoutUntil=0;render();return;}el.textContent=s;setTimeout(tick,500);};setTimeout(tick,500);
  }
}

/* ── EXPLORER ── */
function renderExplorer(app){
  document.body.classList.remove('auth-view');
  removeScreenDecorations();
  const files=S.files,bc=S.breadcrumb,cpk=computePathKey(bc,S.currentDir);
  const fileCount=files.filter(f=>f.kind==='file').length,dCount=files.filter(f=>f.kind==='dir').length;
  const fCount=files.filter(f=>f.kind==='file'&&f.encrypted).length;
  const query=S.searchQuery.trim().toLowerCase();
  const allVisible=query?files.filter(f=>f.name.toLowerCase().includes(query)):files;
  const visible=S.showHidden?allVisible:allVisible.filter(f=>{const fp=cpk===''?f.name:cpk+'/'+f.name;return!S.hiddenFiles.has(fp);});
  const addrHTML=bc.length===0?`<span class="addr-seg cur">&#128274; ${esc(S.currentDir?.name)}</span>`:bc.map((c,i)=>`<button class="addr-seg" data-bc="${i}">${i===0?'&#128274; ':''}${esc(c.name)}</button><span class="addr-arrow">&#8250;</span>`).join('')+`<span class="addr-seg cur">${esc(S.currentDir?.name)}</span>`;
  const sortCls=f=>S.sortBy===f?(S.sortDir==='asc'?' sort-asc':' sort-desc'):'';
  const selFiles=[...S.selectedSet].map(i=>S.files[i]).filter(f=>f&&f.kind==='file');
  const selDirs=[...S.selectedSet].map(i=>S.files[i]).filter(f=>f&&f.kind==='dir');
  const selOne=S.selectedSet.size===1;
  const selEncrypted=selFiles.filter(f=>f.encrypted);
  const selPlain=selFiles.filter(f=>!f.encrypted);
  const canEncrypt=selPlain.length>0||selDirs.length>0;
  const canDecrypt=selEncrypted.length>0||selDirs.length>0;
  const canPaste=!!(S.clipboard?.entries?.length);
  const rowsHTML=visible.map(f=>{
    const ri=S.files.indexOf(f),isSel=S.selectedSet.has(ri);
    if(f.kind==='dir'){const fkey=cpk===''?f.name:cpk+'/'+f.name;const isFav=S.favourites.some(fv=>fv.key===fkey);
      const dIcon=S.dirIcons[fkey];
      const folderIcon=dIcon
        ?`<span class="dir-emoji" data-i="${ri}" data-act="icon" title="Change icon">${dIcon}</span>`
        :`<span class="dir-emoji" data-i="${ri}" data-act="icon" title="Add icon" style="opacity:.65"><img src="icons/folder.svg" style="width:22px;height:22px;filter:brightness(0) invert(1)"></span>`;
      const lockGreenSvg=`<svg viewBox="0 0 24 24" fill="none" stroke="#00e676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;
      const lockRedSvg=`<svg viewBox="0 0 24 24" fill="none" stroke="#ff5252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M17 11V7a5 5 0 0 0-9.9-1"/></svg>`;
      const lockYellowSvg=`<svg viewBox="0 0 24 24" fill="none" stroke="#ffd040" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;
      const dirStatusCell=f.dirStatus==='enc'  ?`<td class="col-status" title="All files encrypted"><span class="status-enc">${lockGreenSvg}</span></td>`
                         :f.dirStatus==='plain'?`<td class="col-status" title="No files encrypted"><span class="status-plain">${lockRedSvg}</span></td>`
                         :f.dirStatus==='mixed'?`<td class="col-status" title="Partially encrypted"><span class="status-mixed">${lockYellowSvg}</span></td>`
                         :`<td class="col-status cell-dim">—</td>`;
      return`<tr class="${isSel?'row-sel':''} dir-row" data-i="${ri}" draggable="true"><td><div class="fn-cell">${folderIcon}<span class="fn-dir">${esc(f.name)}</span></div></td>${dirStatusCell}<td class="cell-dim" id="dir-size-${ri}"></td><td class="cell-dim" id="dir-date-${ri}">—</td><td><div class="cell-acts"><button class="act-btn ren" data-i="${ri}" data-act="ren" title="Rename"><img src="icons/pencil.svg" class="ico" style="filter:brightness(0) invert(0.6) sepia(1) saturate(3) hue-rotate(80deg)"></button><button class="act-btn fav" data-i="${ri}" data-act="fav" title="Favourite"><img src="icons/star.svg" class="ico" style="${isFav?'filter:brightness(0) invert(1) sepia(1) saturate(5) hue-rotate(3deg) brightness(.9)':''}"></button><button class="act-btn del" data-i="${ri}" data-act="del" title="Delete"><img src="icons/trash-2.svg" class="ico"></button></div></td></tr>`;}  
    const lockGreen=`<svg viewBox="0 0 24 24" fill="none" stroke="#00e676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;
    const lockRed=`<svg viewBox="0 0 24 24" fill="none" stroke="#ff5252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M17 11V7a5 5 0 0 0-9.9-1"/></svg>`;
    const statusCell=f.encrypted
      ?`<td class="col-status" title="Encrypted"><span class="status-enc">${lockGreen}</span></td>`
      :`<td class="col-status" title="Plain — not encrypted"><span class="status-plain">${lockRed}</span></td>`;
    const dlBtn=f.encrypted
      ?`<button class="act-btn dl" data-i="${ri}" data-act="dl" title="Decrypt &amp; Download"><img src="icons/download.svg" class="ico"></button>`
      :`<button class="act-btn dl" data-i="${ri}" data-act="dl" title="Download"><img src="icons/download.svg" class="ico"></button>`;
    const fullPath=cpk===''?f.name:cpk+'/'+f.name;
    const isHidden=S.hiddenFiles.has(fullPath);
    const hiddenStyle=isHidden?'opacity:.45;font-style:italic;':'';
    const hideBtn=isHidden
      ?`<button class="act-btn" data-i="${ri}" data-act="unhide" title="Make visible"><img src="icons/eye.svg" class="ico"></button>`
      :`<button class="act-btn" data-i="${ri}" data-act="hide" title="Mark as hidden"><img src="icons/eye-off.svg" class="ico"></button>`;
    return`<tr class="${isSel?'row-sel':''}${isHidden?' row-hidden':''}" data-i="${ri}" draggable="true"><td><div class="fn-cell" style="${hiddenStyle}">${fileTypeImg(f.name)}<span class="fn-name" style="cursor:pointer" data-open="${ri}">${esc(f.name)}</span></div></td>${statusCell}<td class="cell-dim" style="${hiddenStyle}">${fmtBytes(f.plainSize)}</td><td class="cell-dim" style="${hiddenStyle}">${fmtDate(f.modified)}</td><td><div class="cell-acts"><button class="act-btn ren" data-i="${ri}" data-act="ren" title="Rename"><img src="icons/pencil.svg" class="ico" style="filter:brightness(0) invert(0.6) sepia(1) saturate(3) hue-rotate(80deg)"></button>${dlBtn}<button class="act-btn del" data-i="${ri}" data-act="del" title="Delete"><img src="icons/trash-2.svg" class="ico"></button>${hideBtn}</div></td></tr>`;
  }).join('');

  // Icon/tiles/list views — build grid items
  const vm=S.viewMode;
  let contentHTML;
  if(visible.length===0){
    contentHTML=query?`<div class="empty-pane"><div class="ep-ico">&#9678;</div><p>NO MATCH FOR "${esc(query)}"</p></div>`:`<div class="empty-pane"><div class="ep-ico">&#9678;</div><p>VAULT EMPTY</p><small style="display:block;margin-top:8px">UPLOAD OR DROP FILES TO ENCRYPT &amp; STORE</small></div>`;
  }else if(vm==='details'){
    contentHTML=`<table class="file-table" id="file-table"><thead><tr><th class="sortable${sortCls('name')}" data-sort="name" style="position:relative">Name<span class="col-resize" data-col="name"></span></th><th class="col-status" style="position:relative">Status<span class="col-resize" data-col="status"></span></th><th class="sortable${sortCls('size')}" data-sort="size" style="position:relative">Size<span class="col-resize" data-col="size"></span></th><th class="sortable${sortCls('date')}" data-sort="date" style="position:relative">Date Modified<span class="col-resize" data-col="date"></span></th><th style="position:relative">Actions</th></tr></thead><tbody>${rowsHTML}</tbody></table>`;
  }else{
    // grid-based views: large icons / small icons / tiles / list
    const gridItems=visible.map(f=>{
      const ri=S.files.indexOf(f),isSel=S.selectedSet.has(ri);
      const isHid=S.hiddenFiles.has(cpk===''?f.name:cpk+'/'+f.name);
      const fkey=cpk===''?f.name:cpk+'/'+f.name;
      const dIcon=f.kind==='dir'?S.dirIcons[fkey]:null;
      const iconEl=dIcon
        ?`<span style="font-size:${vm==='large'?'40px':vm==='small'?'22px':'24px'};line-height:1;flex-shrink:0">${dIcon}</span>`
        :`<img src="${f.kind==='dir'?'icons/folder.svg':fileTypeImgSrc(f.name)}" style="${f.kind==='dir'?'filter:brightness(0) invert(1)':''};display:block">`;
      return`<div class="file-grid-item${isSel?' sel':''}" data-i="${ri}" style="${isHid?'opacity:.45;':''}">${iconEl}<span class="gi-name">${esc(f.name)}</span></div>`;
    }).join('');
    contentHTML=`<div class="file-grid vmode-${vm}">${gridItems}</div>`;
  }

  app.innerHTML=`<div class="explorer" id="exp">
    <div class="ex-chrome" id="hud-bar">${buildHUD()}</div>
    <div class="ex-addr-row">
      <button class="addr-nav-btn" id="b-back" ${S.navBack.length===0?'disabled':''} title="Back (Alt+Left)"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;display:block"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="addr-nav-btn" id="b-forward" ${S.navForward.length===0?'disabled':''} title="Forward (Alt+Right)"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;display:block"><path d="M9 18l6-6-6-6"/></svg></button>
      <button class="addr-nav-btn" id="b-up" ${bc.length===0?'disabled':''} title="Up one level (Alt+Up)"><img src="icons/arrow-up.svg"></button>
      <button class="addr-nav-btn" id="b-addr-refresh" title="Refresh (F5)"><img src="icons/refresh-cw.svg"></button>
      <button class="addr-nav-btn" id="b-home" title="Go to vault root"><img src="icons/house.svg"></button>
      <div class="addr-pill">${addrHTML}</div>
      <div class="search-wrap" style="margin-left:10px">
        <img src="icons/search.svg" class="search-icon" style="width:14px;height:14px;filter:brightness(0) invert(.35);flex-shrink:0;transition:filter .15s">
        <input type="text" id="search-inp" class="search-inp" placeholder="Search" value="${esc(S.searchQuery)}" autocomplete="off" spellcheck="false">
        ${S.searchQuery?`<button class="search-clear" id="b-search-clear" style="background:transparent;border:none;color:rgba(255,255,255,.3);cursor:pointer;font-size:12px;padding:0 2px;line-height:1">&#x2715;</button>`:''}
      </div>
    </div>
    <div class="ex-toolbar">
      <div class="tb-group">
        <button class="tb-btn" id="b-mkdir" title="New Folder"><img src="icons/folder-plus.svg" class="ico"></button>
      </div>
      <div class="tb-group">
        <button class="tb-btn" id="b-cut" title="Cut" ${S.selectedSet.size===0?'disabled':''}><img src="icons/scissors.svg" class="ico"></button>
        <button class="tb-btn" id="b-copy" title="Copy" ${S.selectedSet.size===0?'disabled':''}><img src="icons/copy.svg" class="ico"></button>
        <button class="tb-btn" id="b-paste" title="Paste" ${!canPaste?'disabled':''}><img src="icons/clipboard.svg" class="ico"></button>
        <button class="tb-btn" id="b-ren-sel" title="Rename" ${!selOne?'disabled':''}><img src="icons/pencil.svg" class="ico"></button>
        <button class="tb-btn" id="b-del-sel" title="Delete" ${S.selectedSet.size===0?'disabled':''}><img src="icons/trash-2.svg" class="ico"></button>
      </div>
      <div class="tb-group">
        <button class="tb-btn tb-enc${canEncrypt?'':' '}" id="b-encrypt" ${canEncrypt?'':'disabled'} title="${canEncrypt?(selDirs.length>0?`Encrypt all files in ${selDirs.length} dir${selDirs.length!==1?'s':''}${selPlain.length>0?' + '+selPlain.length+' file'+( selPlain.length!==1?'s':''):''}`:``+`Encrypt ${selPlain.length} file${selPlain.length!==1?'s':''}`):'Select unencrypted file(s) or folder(s)'}"><img src="icons/lock.svg" class="ico"></button>
        <button class="tb-btn tb-dec${canDecrypt?'':' '}" id="b-decrypt" ${canDecrypt?'':'disabled'} title="${canDecrypt?(selDirs.length>0?`Decrypt all files in ${selDirs.length} dir${selDirs.length!==1?'s':''}${selEncrypted.length>0?' + '+selEncrypted.length+' file'+(selEncrypted.length!==1?'s':''):''}`:``+`Decrypt ${selEncrypted.length} file${selEncrypted.length!==1?'s':''}`):'Select encrypted file(s) or folder(s)'}"><img src="icons/lock-open.svg" class="ico"></button>
      </div>
      <div class="tb-group tb-dropdown" id="tb-sort-wrap">
        <button class="tb-btn" id="b-sort"><img src="icons/arrow-up-down.svg" class="ico"><span class="tb-lbl">Sort &#9660;</span></button>
        ${S.sortMenuOpen?`<div class="tb-drop-menu" id="sort-menu">
          <div class="tb-drop-item" data-sort-field="name"><span class="chk">${S.sortBy==='name'?'✓':''}</span>Name</div>
          <div class="tb-drop-item" data-sort-field="size"><span class="chk">${S.sortBy==='size'?'✓':''}</span>Size</div>
          <div class="tb-drop-item" data-sort-field="date"><span class="chk">${S.sortBy==='date'?'✓':''}</span>Date modified</div>
          <div class="tb-drop-item" data-sort-field="__dir"><span class="chk">${S.sortDir==='asc'?'✓':''}</span>Ascending</div>
          <div class="tb-drop-item" data-sort-field="__dir"><span class="chk">${S.sortDir==='desc'?'✓':''}</span>Descending</div>
        </div>`:''}
      </div>
      <div class="tb-group tb-dropdown" id="tb-view-wrap">

        <button class="tb-btn" id="b-view"><img src="icons/layout-list.svg" class="ico"><span class="tb-lbl">View &#9660;</span></button>
        ${S.viewMenuOpen?`<div class="tb-drop-menu" id="view-menu">
          <div style="font-size:8px;letter-spacing:2px;color:rgba(255,255,255,.3);font-family:var(--ff-mono);padding:6px 12px 2px">LAYOUT</div>
          <div class="tb-drop-item vm-mode" data-vm="details"><span class="chk">${S.viewMode==='details'?'&#10003;':''}</span>Details</div>
          <div class="tb-drop-item vm-mode" data-vm="list"><span class="chk">${S.viewMode==='list'?'&#10003;':''}</span>List</div>
          <div class="tb-drop-item vm-mode" data-vm="small"><span class="chk">${S.viewMode==='small'?'&#10003;':''}</span>Small Icons</div>
          <div class="tb-drop-item vm-mode" data-vm="large"><span class="chk">${S.viewMode==='large'?'&#10003;':''}</span>Large Icons</div>
          <div class="tb-drop-item vm-mode" data-vm="tiles"><span class="chk">${S.viewMode==='tiles'?'&#10003;':''}</span>Tiles</div>
          <div style="border-top:1px solid rgba(255,255,255,.07);margin:4px 0"></div>
          <div class="tb-drop-item" id="vm-hidden"><span class="chk">${S.showHidden?'&#10003;':''}</span>Show hidden files</div>
        </div>`:''}
      </div>
      <div class="tb-group">
        <button class="tb-btn" id="b-dl-sel" title="Download" ${S.selectedSet.size===0?'disabled':''}><img src="icons/download.svg" class="ico"></button>
        <button class="tb-btn" id="b-upload" title="Upload"><img src="icons/upload.svg" class="ico"></button>
      </div>
    </div>
    <div class="ex-body-wrap">

        <div class="tree-bottom">
          ${S.isOPFS?`<div class="tree-btm-row" style="margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,208,64,.12)"><span style="font-size:9px;color:var(--yellow);line-height:1.4">&#9888; Browser Storage Mode<br>Vault stored in this browser only</span></div>`:''}
          ${''/* options + sign-out moved to top bar */}
        </div>
      </div>
      <div class="tree-resize-handle" id="tree-resize-handle"></div>
      <div class="content-pane" id="content-pane">
        <div class="file-scroll" id="file-scroll">${contentHTML}</div>
      </div>
    </div>
    <div class="status-bar" id="status-bar">${buildStatusBar()}</div>
    </div>
    ${S.loading?`<div class="overlay"><div class="spin-lg"></div><div id="ov-msg">${esc(S.loadMsg||'PROCESSING…')}</div><div class="overlay-sub">DO NOT CLOSE THIS TAB</div></div>`:''}

  /* ── Column resize — persisted in _colWidths across renders ── */

  document.querySelectorAll('.col-resize').forEach(handle=>{

  /* ── Dir size + date: fill cells async without blocking render ── */
  visible.filter(f=>f.kind==='dir').forEach(async f=>{

    const dateCell=document.getElementById('dir-date-'+ri);
    if(!sizeCell&&!dateCell)return;

      let sz=0,newest=f.handle.lastModified||0;
      for await(const[,ch] of f.handle.entries()){
        if(ch.kind==='file'){try{const ff=await ch.getFile();sz+=ff.size;if(ff.lastModified>newest)newest=ff.lastModified;}catch{}}
        else if(ch.kind==='directory'){try{for await(const[,gc] of ch.entries()){if(gc.kind==='file'){try{const gf=await gc.getFile();if(gf.lastModified>newest)newest=gf.lastModified;}catch{}}}}catch{}}
      }
      if(sizeCell)sizeCell.textContent=fmtBytes(sz);
      if(dateCell)dateCell.textContent=newest?fmtDate(newest):'—';
    }catch{if(sizeCell)sizeCell.textContent='';}
  });

  /* ── Rows: set drag data so internal moves work ── */
  document.querySelectorAll('[data-i]').forEach(row=>{
    row.addEventListener('dragstart',e=>{
      e.dataTransfer.setData('text/nmk-row',row.dataset.i);
      e.dataTransfer.effectAllowed='move';
    });

  /* ── Dir row: accept both OS-file drops and internal row moves ── */
  document.querySelectorAll('.dir-row').forEach(row=>{
    const i=+row.dataset.i;
    row.addEventListener('dragover',e=>{e.preventDefault();e.stopPropagation();e.dataTransfer.dropEffect='move';row.classList.add('drag-over');});
    row.addEventListener('dragleave',e=>{if(!row.contains(e.relatedTarget))row.classList.remove('drag-over');});
    row.addEventListener('drop',async e=>{
      e.preventDefault();e.stopPropagation();row.classList.remove('drag-over');
      const destDir=S.files[i];
      if(!destDir||destDir.kind!=='dir')return;

      /* Internal move: row dragged from the same directory */
      const srcIdx=e.dataTransfer.getData('text/nmk-row');
      if(srcIdx!==''){
        const si=+srcIdx;
        const src=S.files[si];
        if(!src||si===i)return;
        S.loading=true;S.loadMsg='Moving…';render();
        try{
          const destHandle=destDir.handle;
          async function copyDirTo(srcH,destParent,name){
            const dh=await destParent.getDirectoryHandle(name,{create:true});
            for await(const[n,h]of srcH.entries()){if(h.kind==='directory')await copyDirTo(h,dh,n);else{const buf=await(await h.getFile()).arrayBuffer();const wh=await dh.getFileHandle(n,{create:true});const w=await wh.createWritable();await w.write(buf);await w.close();}}
          }
          if(src.kind==='dir'){
            await copyDirTo(src.handle,destHandle,src.name);
            await S.currentDir.removeEntry(src.name,{recursive:true});
          }else{
            const buf=await(await src.handle.getFile()).arrayBuffer();
            const nfh=await destHandle.getFileHandle(src.name,{create:true});
            const w=await nfh.createWritable();await w.write(buf);await w.close();
            await S.currentDir.removeEntry(src.name);
          }
          S.selectedSet.clear();
          S.files=await vaultList(S.currentDir);
          S.loading=false;
          render();
          toast(`Moved "${src.name}" → ${destDir.name}`,'ok');
        }catch(err){S.loading=false;render();toast('Move failed: '+err.message,'err');}
        return;
      }

      /* OS file drop */
      const dtFiles=[...e.dataTransfer.files];
      if(dtFiles.length>0){
        const prev=S.currentDir;
        S.currentDir=destDir.handle;
        await processFiles(dtFiles);
        S.currentDir=prev;
        S.files=await vaultList(S.currentDir);
        render();
      }
    });
  });

  /* ── File row drag (for cut/copy via drag) is draggable=true on rows ── */
  document.querySelectorAll('.file-table th.sortable').forEach(th=>th.onclick=()=>{if(_resizeDragged){_resizeDragged=false;return;}actSort(th.dataset.sort);});
  const fs=document.getElementById('file-scroll');
  if(fs){
    fs.addEventListener('click',e=>{
      if(e.target.closest('[data-act]'))return;
      const el=e.target.closest('[data-i]');
      const _syncSel=()=>document.querySelectorAll('#file-scroll [data-i]').forEach(r=>{r.classList.toggle('row-sel',S.selectedSet.has(+r.dataset.i));});
      const _syncToolbar=()=>{
        const sf=[...S.selectedSet].map(i=>S.files[i]).filter(f=>f&&f.kind==='file');
        const sd=[...S.selectedSet].map(i=>S.files[i]).filter(f=>f&&f.kind==='dir');
        const enc=document.getElementById('b-encrypt'),dec=document.getElementById('b-decrypt');
        const ren=document.getElementById('b-ren-sel'),del=document.getElementById('b-del-sel');
        const cut=document.getElementById('b-cut'),cpy=document.getElementById('b-copy');
        const dl=document.getElementById('b-dl-sel');
        const plain=sf.filter(f=>!f.encrypted),encrypted=sf.filter(f=>f.encrypted);
        const canEnc=plain.length>0||sd.length>0,canDec=encrypted.length>0||sd.length>0;
        if(enc){enc.disabled=!canEnc;} if(dec){dec.disabled=!canDec;}
        if(ren){ren.disabled=S.selectedSet.size!==1;} if(del){del.disabled=S.selectedSet.size===0;}
        if(cut){cut.disabled=S.selectedSet.size===0;} if(cpy){cpy.disabled=S.selectedSet.size===0;}
        if(dl){dl.disabled=S.selectedSet.size===0;}
      };
      if(!el){S.selectedSet.clear();_syncSel();_syncToolbar();_syncStatusBar();return;}
      const i=+el.dataset.i,f=files[i];if(!f)return;
      if(e.ctrlKey||e.metaKey){if(S.selectedSet.has(i))S.selectedSet.delete(i);else S.selectedSet.add(i);_syncSel();_syncToolbar();_syncStatusBar();}
      else if(e.shiftKey){const last=[...S.selectedSet].pop()??i;const lo=Math.min(last,i),hi=Math.max(last,i);for(let x=lo;x<=hi;x++)S.selectedSet.add(x);_syncSel();_syncToolbar();_syncStatusBar();}
      else{S.selectedSet=new Set([i]);_syncSel();_syncToolbar();_syncStatusBar();}
    });
    fs.addEventListener('dblclick',e=>{const el=e.target.closest('[data-i]');if(!el)return;const f=files[+el.dataset.i];if(f&&f.kind==='dir')actNavigateIn(+el.dataset.i);else if(f&&f.kind==='file')actOpenFile(+el.dataset.i);});
  }
  // Grid view click/dblclick (non-details modes)
  const fg=document.querySelector('.file-grid');
  if(fg){
    fg.addEventListener('click',e=>{
      const el=e.target.closest('.file-grid-item');
      const _syncSel=()=>document.querySelectorAll('.file-grid-item').forEach(r=>{r.classList.toggle('sel',S.selectedSet.has(+r.dataset.i));});
      const _syncToolbar=()=>{
        const sf=[...S.selectedSet].map(i=>S.files[i]).filter(f=>f&&f.kind==='file');
        const sd=[...S.selectedSet].map(i=>S.files[i]).filter(f=>f&&f.kind==='dir');
        const enc=document.getElementById('b-encrypt'),dec=document.getElementById('b-decrypt');
        const plain=sf.filter(f=>!f.encrypted),encrypted=sf.filter(f=>f.encrypted);
        if(enc){enc.disabled=!(plain.length>0||sd.length>0);}
        if(dec){dec.disabled=!(encrypted.length>0||sd.length>0);}
        const del=document.getElementById('b-del-sel');if(del)del.disabled=S.selectedSet.size===0;
      };
      if(!el){S.selectedSet.clear();_syncSel();_syncToolbar();_syncStatusBar();return;}
      const i=+el.dataset.i;
      if(e.ctrlKey||e.metaKey){if(S.selectedSet.has(i))S.selectedSet.delete(i);else S.selectedSet.add(i);_syncSel();_syncToolbar();_syncStatusBar();}
      else{S.selectedSet=new Set([i]);_syncSel();_syncToolbar();_syncStatusBar();}
    });
    fg.addEventListener('dblclick',e=>{
      const el=e.target.closest('.file-grid-item');if(!el)return;
      const f=files[+el.dataset.i];
      if(f&&f.kind==='dir')actNavigateIn(+el.dataset.i);else if(f&&f.kind==='file')actOpenFile(+el.dataset.i);
    });
  }
  document.querySelectorAll('[data-act="dl"]').forEach(b=>b.onclick=e=>{e.stopPropagation();actDownload(+b.dataset.i);});
  document.querySelectorAll('[data-act="del"]').forEach(b=>b.onclick=e=>{e.stopPropagation();actDeleteSingle(+b.dataset.i);});
  document.querySelectorAll('[data-act="ren"]').forEach(b=>b.onclick=e=>{e.stopPropagation();actRename(+b.dataset.i);});
  document.querySelectorAll('[data-act="hide"]').forEach(b=>b.onclick=e=>{e.stopPropagation();actHide(+b.dataset.i,true);});
  document.querySelectorAll('[data-act="unhide"]').forEach(b=>b.onclick=e=>{e.stopPropagation();actHide(+b.dataset.i,false);});
  document.querySelectorAll('[data-act="fav"]').forEach(b=>b.onclick=e=>{e.stopPropagation();const f=files[+b.dataset.i];if(f&&f.kind==='dir'){const k=cpk===''?f.name:cpk+'/'+f.name;actToggleFav(k,f.name);}});
  document.querySelectorAll('[data-act="icon"]').forEach(b=>b.onclick=e=>{e.stopPropagation();const f=files[+b.dataset.i];if(f&&f.kind==='dir'){const k=cpk===''?f.name:cpk+'/'+f.name;openDirIconPicker(+b.dataset.i,k);}});
  document.querySelectorAll('[data-open]').forEach(el=>el.ondblclick=e=>{e.stopPropagation();const i=+el.dataset.open;actOpenFile(i);});
  document.querySelectorAll('[data-open]').forEach(el=>el.onclick=e=>{e.stopPropagation();const i=+el.dataset.open;if(e.ctrlKey||e.metaKey){if(S.files[i]?.kind==='file'){if(S.selectedSet.has(i))S.selectedSet.delete(i);else S.selectedSet.add(i);}else{S.selectedSet=new Set([i]);}document.querySelectorAll('#file-scroll [data-i]').forEach(r=>{r.classList.toggle('row-sel',S.selectedSet.has(+r.dataset.i));});}else{S.selectedSet=new Set([i]);document.querySelectorAll('#file-scroll [data-i]').forEach(r=>{r.classList.toggle('row-sel',+r.dataset.i===i);});}/* sync toolbar */const sf=[...S.selectedSet].map(x=>S.files[x]).filter(f=>f&&f.kind==='file');const sd=[...S.selectedSet].map(x=>S.files[x]).filter(f=>f&&f.kind==='dir');const enc=document.getElementById('b-encrypt'),dec=document.getElementById('b-decrypt');if(enc)enc.disabled=!(sf.filter(f=>!f.encrypted).length>0||sd.length>0);if(dec)dec.disabled=!(sf.filter(f=>f.encrypted).length>0||sd.length>0);_syncStatusBar();});

  document.querySelectorAll('.fn-dir').forEach(el=>el.onclick=e=>{e.stopPropagation();const row=el.closest('[data-i]');if(row){const i=+row.dataset.i;S.selectedSet=new Set([i]);document.querySelectorAll('#file-scroll [data-i]').forEach(r=>{r.classList.toggle('row-sel',+r.dataset.i===i);});_syncStatusBar();}});
  /* ── Tree-pane resize handle ── */
  (function(){
    const handle=document.getElementById('tree-resize-handle');
    const pane=document.getElementById('tree-pane');
    if(!handle||!pane)return;
    const PREF_KEY='nmk_tree_width';
    /* Restore saved width */
    const saved=parseInt(localStorage.getItem(PREF_KEY));
    if(saved&&saved>=160&&saved<=480){pane.style.width=saved+'px';}
    let startX=0,startW=0,dragging=false;
    handle.addEventListener('mousedown',e=>{
      if(e.button!==0)return;
      dragging=true;startX=e.clientX;startW=pane.offsetWidth;
      handle.classList.add('dragging');
      document.body.style.cursor='col-resize';
      document.body.style.userSelect='none';
      e.preventDefault();
    });
    document.addEventListener('mousemove',e=>{
      if(!dragging)return;
      const w=Math.min(480,Math.max(160,startW+(e.clientX-startX)));
      pane.style.width=w+'px';
    });
    document.addEventListener('mouseup',()=>{
      if(!dragging)return;
      dragging=false;
      handle.classList.remove('dragging');
      document.body.style.cursor='';
      document.body.style.userSelect='';
      localStorage.setItem(PREF_KEY,pane.offsetWidth);
    });
  })();

  document.getElementById('tree-pane')?.addEventListener('click',async e=>{const favBtn=e.target.closest('.fav-btn'),togEl=e.target.closest('[data-tree-tog]'),recEl=e.target.closest('[data-recent-i]'),clearRec=e.target.closest('[data-clear-recent]'),secEl=e.target.closest('[data-tree-sec]'),navEl=e.target.closest('[data-tree-nav]');if(favBtn){e.stopPropagation();actToggleFav(favBtn.dataset.favKey,favBtn.dataset.favName);}else if(togEl){e.stopPropagation();await actTreeToggle(togEl.dataset.treeTog);}else if(clearRec){e.stopPropagation();S.recentFiles=[];savePrefs();render();}else if(secEl){e.stopPropagation();const sec=secEl.dataset.treeSec;S.treeSecCollapse=S.treeSecCollapse||{};S.treeSecCollapse[sec]=!S.treeSecCollapse[sec];render();}else if(recEl){await actRecentNav(+recEl.dataset.recentI);}else if(navEl){await actTreeNav(navEl.dataset.treeNav);}});
  const cp=document.getElementById('content-pane');
  if(cp){cp.addEventListener('dragover',e=>{e.preventDefault();cp.classList.add('drag-over');});cp.addEventListener('dragleave',e=>{if(!cp.contains(e.relatedTarget))cp.classList.remove('drag-over');});cp.addEventListener('drop',e=>{cp.classList.remove('drag-over');actDrop(e);});}
  if(S.modal)bindModalEvents();
  document.onkeydown=e=>{if(S.view!=='explorer')return;if(e.ctrlKey&&e.key==='f'){e.preventDefault();document.getElementById('search-inp')?.focus();document.getElementById('search-inp')?.select();return;}if(e.target.matches('input,textarea'))return;if(S.optionsOpen&&!S.modal){if(e.key==='Escape'){S.optionsOpen=false;render();}return;}if(S.modal){if(e.key==='Escape'){const fo=S.modal.fromOptions;S.modal=null;if(fo)S.optionsOpen=true;render();}return;}if(e.ctrlKey&&e.key==='a'){e.preventDefault();actSelectAll();}if(e.ctrlKey&&e.key==='l'){e.preventDefault();actLock();}if(e.key==='Delete'&&S.selectedSet.size>0){e.preventDefault();actBulkDelete();}if(e.key==='Escape'){S.selectedSet.clear();S.userMenuOpen=false;render();}if(e.key==='F5'){e.preventDefault();actRefresh();}if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();actNavBack();}if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();actNavForward();}if(e.key==='Backspace'&&bc.length>0){e.preventDefault();actNavUp();}};
  _tick();
}
